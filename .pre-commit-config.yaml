repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: ^packaged_charts/
      - id: detect-private-key
        exclude: ^charts/.*/values\.example\.yaml$|^charts/gitops-bootstrap/tests/__snapshot__/snapshot_test\.yaml\.snap$
  - repo: local
    hooks:
      - id: trunk-check
        name: Trunk check
        entry: trunk check
        language: system
        pass_filenames: false # Let Trunk handle finding changed files based on git status/index
        stages: [pre-commit]
