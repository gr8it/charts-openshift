      gatlingImage: gcr.isreg.gr8it.cloud/isreg/integration/load-and-performance-testing:1.6.0
      rcloneImage: rclone/rclone:latest
      resources:
        limits:
          cpu: 1000m
          memory: 2Gi
      serviceAccountName: gatling-operator-worker
    testScenarioSpec:
      env:
      - name: ENV
        value: dev
      - name: TARGET_URL
        value: https://daup.apps.s1.lab.sp.gr8it.cloud
      - name: CONCURRENCY
        value: "2"
      - name: DURATION
        value: "10"
      - name: JAVA_OPTS
        value: -Dgatling.http.warmUpUrl=https://daup.apps.s1.lab.sp.gr8it.cloud/health
      - name: RCLONE_S3_PROVIDER
        value: Other
      - name: RCLONE_NO_CHECK_CERTIFICATE
        value: "true"
