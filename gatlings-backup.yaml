        valueFrom:
          secretKeyRef:
            key: access_key_id
            name: obc-gatling-sample-01-allinfo
      - name: RCLONE_S3_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            key: access_key_secret
            name: obc-gatling-sample-01-allinfo
      - name: RCLONE_S3_ENDPOINT
        valueFrom:
          secretKeyRef:
            key: endpoint
            name: obc-gatling-sample-01-allinfo
      - name: RCLONE_S3_REGION
        value: us-east-1
      - name: SSL_CERT_FILE
        value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
      parallelism: 1
      simulationClass: MyBasicSimulation
      simulationData:
        MyBasicSimulation.scala: |
          import io.gatling.core.Predef._
          import io.gatling.http.Predef._

          class MyBasicSimulation extends Simulation {

            val targetUrl = sys.env.getOrElse("TARGET_URL", "https://daup.apps.s1.lab.sp.gr8it.cloud")

            val httpProtocol = http
              .baseUrl(targetUrl)
              .acceptHeader("text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")
              .acceptLanguageHeader("en-US,en;q=0.5")
              .acceptEncodingHeader("gzip, deflate")
              .userAgentHeader("Mozilla/5.0")

            val scn = scenario("Inline K8s Load Test")
              .exec(http("Health check").get("/health"))

            setUp(
              scn.inject(atOnceUsers(sys.env.getOrElse("CONCURRENCY", "2").toInt))
            ).protocols(httpProtocol)
          }
