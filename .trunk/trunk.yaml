version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
lint:
  enabled:
    - bandit@1.9.4
    - black@26.10.1
    - checkov@3.4.0
    - git-diff-check
    - hadolint@2.15.1
    - isort@9.0.2
    - markdownlint@0.50.0
    - oxipng@10.2.1
    - prettier@3.9.10
    - ruff@0.17.3
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - trufflehog@3.99.7
    - yamllint@1.38.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
