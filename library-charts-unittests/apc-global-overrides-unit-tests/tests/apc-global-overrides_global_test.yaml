# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: APC global overrides - global values only
templates:
  - templates/apc-global-overrides.yaml
values:
  - ../values.global.yaml
release:
  name: agout
  namespace: default

tests:
  - it: manifest should match snapshot
    asserts:
      - matchSnapshot: {}

  - it: customer from global
    asserts:
      - equal: { path: data.customer, value: customer-global }
      - equal: { path: data.customerName, value: customerName-global }
  
  - it: repo fields from global
    asserts:
      - equal: { path: data.repoURL, value: repoURL-global }
      - equal: { path: data.repoTargetRevision, value: repoTargetRevision-global }

  - it: environment fields from global
    asserts:
      - equal: { path: data.environment, value: environment-global }
      - equal: { path: data.environmentShort, value: environmentShort-global }

  - it: cluster identity fields from global
    asserts:
      - equal: { path: data.clusterName, value: clusterName-global }
      - equal: { path: data.clusterAcmName, value: clusterAcmName-global }
      - equal: { path: data.clusterType, value: clusterType-global }

  - it: cluster domain and API fields from global
    asserts:
      - equal: { path: data.clusterBaseDomain, value: clusterBaseDomain-global }
      - equal: { path: data.clusterAppsDomain, value: clusterAppsDomain-global }
      - equal: { path: data.clusterApiURL, value: clusterApiURL-global }

  - it: cluster API versions from global
    asserts:
      - equal: { path: data.clusterKubeVersion, value: clusterKubeVersion-global }
      - equal:
          path: data.clusterApiVersions
          value:
            - clusterApiVersions-global

  - it: clusterServices and merged (global only, no local keys in non-merged)
    asserts:
      - equal: { path: data.clusterServices.global.url, value: clusterServicesGlobalUrl-global }
      - equal: { path: data.clusterServices.override.url, value: clusterServicesOverrideUrl-global }
      - notExists: { path: data.clusterServices.local }
      - equal: { path: data.clusterServicesMerged.global.url, value: clusterServicesGlobalUrl-global }
      - equal: { path: data.clusterServicesMerged.override.url, value: clusterServicesOverrideUrl-global }
      - notExists: { path: data.clusterServicesMerged.local }

  - it: booleans from global
    asserts:
      - equal: { path: data.clusterIsHub, value: true }
      - equal: { path: data.clusterRunsApps, value: true }

  - it: proxy, noProxy, proxyCIDRs from global
    asserts:
      - equal: { path: data.proxy, value: proxy-global }
      - equal: { path: data.noProxy, value: noProxy-global }
      - equal:
          path: data.proxyCIDRs
          value:
            - proxyIP-global

  - it: ntpServers from global
    asserts:
      - equal:
          path: data.ntpServers
          value:
            - ntp-global

  - it: chronyConfig from global
    asserts:
      - matchRegex:
          path: data.chronyConfig
          pattern: ntp-global

  - it: sshAuthorizedKeys from global
    asserts:
      - equal:
          path: data.sshAuthorizedKeys
          value:
            - ssh-ed25519 AAAA global-key

  - it: imageProxy from global
    asserts:
      - equal: { path: data.imageProxyHost, value: global.example.com }
      - equal:
          path: data.imageProxySources
          value:
            - quay.io-global
            - docker.io-global

  - it: adIntegration from global with attribute defaults applied
    asserts:
      - equal: { path: data.adIntegration.name, value: "AD Login global" }
      - equal: { path: data.adIntegration.type, value: "LDAP" }
      - equal: { path: data.adIntegration.mappingMethod, value: "claim" }
      - equal: { path: data.adIntegration.ldap.bindDN, value: "cn=svc-global,dc=global,dc=com" }
      - equal: { path: data.adIntegration.ldap.url, value: "ldaps://ad-global.example.com/dc=global,dc=com" }
      - equal: { path: data.adIntegration.ldap.insecure, value: false }
      - equal:
          path: data.adIntegration.ldap.attributes.email
          value:
            - "mail-global"
      - equal:
          path: data.adIntegration.ldap.attributes.id
          value:
            - "sAMAccountName-global"
      - equal:
          path: data.adIntegration.ldap.attributes.name
          value:
            - "cn-global"
      - equal:
          path: data.adIntegration.ldap.attributes.preferredUsername
          value:
            - "sAMAccountName-global"

  - it: ldapIntegration from global with attribute defaults applied
    asserts:
      - equal: { path: data.ldapIntegration.name, value: "LDAP Login global" }
      - equal: { path: data.ldapIntegration.type, value: "LDAP" }
      - equal: { path: data.ldapIntegration.mappingMethod, value: "claim" }
      - equal: { path: data.ldapIntegration.ldap.bindDN, value: "cn=svc-global,dc=global,dc=com" }
      - equal: { path: data.ldapIntegration.ldap.url, value: "ldaps://ldap-global.example.com/dc=global,dc=com" }
      - equal: { path: data.ldapIntegration.ldap.insecure, value: false }
      - equal:
          path: data.ldapIntegration.ldap.attributes.email
          value:
            - "mail-global"
      - equal:
          path: data.ldapIntegration.ldap.attributes.id
          value:
            - "dn-global"
      - equal:
          path: data.ldapIntegration.ldap.attributes.name
          value:
            - "cn-global"
      - equal:
          path: data.ldapIntegration.ldap.attributes.preferredUsername
          value:
            - "uid-global"

  - it: services and merged (global only, no local keys in non-merged)
    asserts:
      - equal: { path: data.services.global.url, value: servicesGlobalUrl-global }
      - notExists: { path: data.services.local }
      - equal: { path: data.servicesMerged.global.url, value: servicesGlobalUrl-global }
      - notExists: { path: data.servicesMerged.local }
      - equal: { path: data.servicesExtracted.certManager.defaultClusterIssuer, value: certManagerDefaultClusterIssuer-global }
      - equal: { path: data.servicesExtracted.crossplane.kubeVaultProviderConfigName, value: crossplaneKubeVaultProviderConfigName-global }
      - equal: { path: data.servicesExtracted.externalSecretsOperator.defaultClusterSecretStore, value: ESODefaultClusterSecretStore-global }
      - equal: { path: data.servicesExtracted.vault.kubeAuthMountPath, value: vaultKubeAuthMountPath-global }
      - equal: { path: data.servicesExtracted.vault.name, value: vaultName-global }
      - equal: { path: data.servicesExtracted.vault.url, value: vaultUrl-global }

  - it: caCertificates and merged (global only, no local keys in non-merged)
    asserts:
      - equal:
          path: data.caCertificates["override.crt"]
          value: |
            -----BEGIN CERTIFICATE-----
            global
            -----END CERTIFICATE-----
      - equal:
          path: data.caCertificates["global.crt"]
          value: |
            -----BEGIN CERTIFICATE-----
            global
            -----END CERTIFICATE-----
      - notExists:
          path: data.caCertificates["local.crt"]
      - equal:
          path: data.caCertificatesMerged["override.crt"]
          value: |
            -----BEGIN CERTIFICATE-----
            global
            -----END CERTIFICATE-----
      - equal:
          path: data.caCertificatesMerged["global.crt"]
          value: |
            -----BEGIN CERTIFICATE-----
            global
            -----END CERTIFICATE-----
