# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: APC global overrides - combined local and global values
templates:
  - templates/apc-global-overrides.yaml
values:
  - ../values.global.yaml
  - ../values.local.yaml
release:
  name: agout
  namespace: default

tests:
  - it: manifest should match snapshot
    asserts:
      - matchSnapshot: {}

  - it: customer local over global
    asserts:
      - equal: { path: data.customer, value: customer-local }

  - it: repo fields prefer local over global
    asserts:
      - equal: { path: data.repoURL, value: repoURL-local }
      - equal: { path: data.repoTargetRevision, value: repoTargetRevision-local }

  - it: environment fields prefer local over global
    asserts:
      - equal: { path: data.environment, value: environment-local }
      - equal: { path: data.environmentShort, value: environmentShort-local }

  - it: cluster identity fields prefer local over global
    asserts:
      - equal: { path: data.clusterName, value: clusterName-local }
      - equal: { path: data.clusterAcmName, value: clusterAcmName-local }
      - equal: { path: data.clusterType, value: clusterType-local }

  - it: cluster domain and API fields prefer local over global
    asserts:
      - equal: { path: data.clusterBaseDomain, value: clusterBaseDomain-local }
      - equal: { path: data.clusterAppsDomain, value: clusterAppsDomain-local }
      - equal: { path: data.clusterApiURL, value: clusterApiURL-local }

  - it: cluster API versions prefer local over global
    asserts:
      - equal: { path: data.clusterKubeVersion, value: clusterKubeVersion-local }
      - equal:
          path: data.clusterApiVersions
          value:
            - clusterApiVersions-local

  - it: clusterServices and merged include global+local with local precedence; global key absent in non-merged
    asserts:
      - equal: { path: data.clusterServices.local.url, value: clusterServicesLocalUrl-local }
      - equal: { path: data.clusterServices.override.url, value: clusterServicesOverrideUrl-local }
      - notExists: { path: data.clusterServices.global }
      - equal: { path: data.clusterServicesMerged.global.url, value: clusterServicesGlobalUrl-global }
      - equal: { path: data.clusterServicesMerged.local.url, value: clusterServicesLocalUrl-local }
      - equal: { path: data.clusterServicesMerged.override.url, value: clusterServicesOverrideUrl-local }

  - it: booleans prefer local over global
    asserts:
      - equal: { path: data.clusterIsHub, value: false }
      - equal: { path: data.clusterRunsApps, value: false }

  - it: proxy, noProxy, proxyCIDRs prefer local over global
    asserts:
      - equal: { path: data.proxy, value: proxy-local }
      - equal: { path: data.noProxy, value: noProxy-local }
      - equal:
          path: data.proxyCIDRs
          value:
            - proxyIP-local1
            - proxyIP-local2

  - it: ntpServers prefer local over global
    asserts:
      - equal:
          path: data.ntpServers
          value:
            - ntp-local1
            - ntp-local2

  - it: chronyConfig prefer local over global
    asserts:
      - matchRegex:
          path: data.chronyConfig
          pattern: ntp-local1
      - matchRegex:
          path: data.chronyConfig
          pattern: ntp-local2

  - it: sshAuthorizedKeys prefer local over global
    asserts:
      - equal:
          path: data.sshAuthorizedKeys
          value: 
            - ssh-ed25519 AAAA local1-key
            - ssh-ed25519 AAAA local2-key

  - it: imageProxy prefer local over global
    asserts:
      - equal: { path: data.imageProxyHost, value: local.example.com }
      - equal:
          path: data.imageProxySources
          value:
            - quay.io-local

  - it: adIntegration prefer local over global with attribute defaults applied
    asserts:
      - equal: { path: data.adIntegration.name, value: "AD Login local" }
      - equal: { path: data.adIntegration.type, value: "LDAP" }
      - equal: { path: data.adIntegration.mappingMethod, value: "claim" }
      - equal: { path: data.adIntegration.ldap.bindDN, value: "cn=svc-local,dc=local,dc=com" }
      - equal: { path: data.adIntegration.ldap.url, value: "ldaps://ad-local.example.com/dc=local,dc=com" }
      - equal: { path: data.ldapIntegration.ldap.insecure, value: true }
      - equal:
          path: data.adIntegration.ldap.attributes.email
          value:
            - "mail-local"
      - equal:
          path: data.adIntegration.ldap.attributes.id
          value:
            - "sAMAccountName-local"
      - equal:
          path: data.adIntegration.ldap.attributes.name
          value:
            - "cn-local"
      - equal:
          path: data.adIntegration.ldap.attributes.preferredUsername
          value:
            - "sAMAccountName-local"

  - it: ldapIntegration prefer local over global with attribute defaults applied
    asserts:
      - equal: { path: data.ldapIntegration.name, value: "LDAP Login local" }
      - equal: { path: data.ldapIntegration.type, value: "LDAP" }
      - equal: { path: data.ldapIntegration.mappingMethod, value: "claim" }
      - equal: { path: data.ldapIntegration.ldap.bindDN, value: "cn=svc-local,dc=local,dc=com" }
      - equal: { path: data.ldapIntegration.ldap.url, value: "ldaps://ldap-local.example.com/dc=local,dc=com" }
      - equal: { path: data.ldapIntegration.ldap.insecure, value: true }
      - equal:
          path: data.ldapIntegration.ldap.attributes.email
          value:
            - "mail-local"
      - equal:
          path: data.ldapIntegration.ldap.attributes.id
          value:
            - "dn-local"
      - equal:
          path: data.ldapIntegration.ldap.attributes.name
          value:
            - "cn-local"
      - equal:
          path: data.ldapIntegration.ldap.attributes.preferredUsername
          value:
            - "uid-local"

  - it: services and merged include global+local with local precedence; global key absent in non-merged
    asserts:
      - equal: { path: data.services.local.url, value: servicesLocaltUrl-local }
      - notExists: { path: data.services.global }
      - equal: { path: data.servicesMerged.global.url, value: servicesGlobalUrl-global }
      - equal: { path: data.servicesMerged.local.url, value: servicesLocaltUrl-local }
      - equal: { path: data.servicesExtracted.certManager.defaultClusterIssuer, value: certManagerDefaultClusterIssuer-local }
      - equal: { path: data.servicesExtracted.crossplane.kubeVaultProviderConfigName, value: crossplaneKubeVaultProviderConfigName-local }
      - equal: { path: data.servicesExtracted.externalSecretsOperator.defaultClusterSecretStore, value: ESODefaultClusterSecretStore-local }
      - equal: { path: data.servicesExtracted.vault.kubeAuthMountPath, value: vaultKubeAuthMountPath-local }
      - equal: { path: data.servicesExtracted.vault.name, value: vaultName-local }
      - equal: { path: data.servicesExtracted.vault.url, value: vaultUrl-local }

  - it: imageProxy local overrides global
    asserts:
      - equal: { path: data.imageProxyHost, value: local.example.com }
      - equal:
          path: data.imageProxySources
          value:
            - quay.io-local

  - it: adIntegration from local with attribute defaults applied
    asserts:
      - equal: { path: data.adIntegration.name, value: "AD Login local" }
      - equal: { path: data.adIntegration.type, value: "LDAP" }
      - equal: { path: data.adIntegration.mappingMethod, value: "claim" }
      - equal: { path: data.adIntegration.ldap.bindDN, value: "cn=svc-local,dc=local,dc=com" }
      - equal: { path: data.adIntegration.ldap.url, value: "ldaps://ad-local.example.com/dc=local,dc=com" }
      - equal: { path: data.adIntegration.ldap.insecure, value: true }
      - equal:
          path: data.adIntegration.ldap.attributes.email
          value:
            - "mail-local"
      - equal:
          path: data.adIntegration.ldap.attributes.id
          value:
            - "sAMAccountName-local"
      - equal:
          path: data.adIntegration.ldap.attributes.name
          value:
            - "cn-local"
      - equal:
          path: data.adIntegration.ldap.attributes.preferredUsername
          value:
            - "sAMAccountName-local"

  - it: ldapIntegration from local with attribute defaults applied
    asserts:
      - equal: { path: data.ldapIntegration.name, value: "LDAP Login local" }
      - equal: { path: data.ldapIntegration.type, value: "LDAP" }
      - equal: { path: data.ldapIntegration.mappingMethod, value: "claim" }
      - equal: { path: data.ldapIntegration.ldap.bindDN, value: "cn=svc-local,dc=local,dc=com" }
      - equal: { path: data.ldapIntegration.ldap.url, value: "ldaps://ldap-local.example.com/dc=local,dc=com" }
      - equal: { path: data.ldapIntegration.ldap.insecure, value: true }
      - equal:
          path: data.ldapIntegration.ldap.attributes.email
          value:
            - "mail-local"
      - equal:
          path: data.ldapIntegration.ldap.attributes.id
          value:
            - "dn-local"
      - equal:
          path: data.ldapIntegration.ldap.attributes.name
          value:
            - "cn-local"
      - equal:
          path: data.ldapIntegration.ldap.attributes.preferredUsername
          value:
            - "uid-local"

  - it: caCertificates and merged include global+local with local precedence; global key absent in non-merged
    asserts:
      - equal:
          path: data.caCertificates["override.crt"]
          value: |
            -----BEGIN CERTIFICATE-----
            local
            -----END CERTIFICATE-----
      - equal:
          path: data.caCertificates["local.crt"]
          value: |
            -----BEGIN CERTIFICATE-----
            local
            -----END CERTIFICATE-----
      - notExists:
          path: data.caCertificates["global.crt"]
      - equal:
          path: data.caCertificatesMerged["global.crt"]
          value: |
            -----BEGIN CERTIFICATE-----
            global
            -----END CERTIFICATE-----
      - equal:
          path: data.caCertificatesMerged["local.crt"]
          value: |
            -----BEGIN CERTIFICATE-----
            local
            -----END CERTIFICATE-----
      - equal:
          path: data.caCertificatesMerged["override.crt"]
          value: |
            -----BEGIN CERTIFICATE-----
            local
            -----END CERTIFICATE-----
