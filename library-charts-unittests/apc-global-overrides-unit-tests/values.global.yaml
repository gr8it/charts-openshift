# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

global:
  apc:
    customer: customer-global
    repoURL: repoURL-global
    repoTargetRevision: repoTargetRevision-global 
    environment: environment-global
    environmentShort: environmentShort-global
    cluster:
      name: clusterName-global
      acmName: clusterAcmName-global
      type: clusterType-global
      rootDomain: clusterRootDomain-global
      baseDomain: clusterBaseDomain-global
      appsDomain: clusterAppsDomain-global
      apiURL: clusterApiURL-global
      kubeVersion: clusterKubeVersion-global
      apiVersions:
        - clusterApiVersions-global
      services:
        global:
          url: clusterServicesGlobalUrl-global
        override:
          url: clusterServicesOverrideUrl-global
      isHub: true
      runsApps: true
    proxy: proxy-global
    noProxy: noProxy-global
    proxyCIDRs:
      - proxyIP-global
    ntpServers:
      - ntp-global
    sshAuthorizedKeys: "ssh-ed25519 AAAA global-key"
    imageProxy:
      host: global.example.com
      sources:
        - quay.io-global
        - docker.io-global
    adIntegration:
      name: AD Login global
      ldap:
        attributes:
          bindDN: "cn=svc-global,dc=global,dc=com"
          url: "ldaps://ad-global.example.com/dc=global,dc=com"
          email:
            - mail-global
          id:
            - sAMAccountName-global
          name:
            - cn-global
          preferredUsername:
            - sAMAccountName-global
    ldapIntegration:
      name: LDAP Login global
      ldap:
        attributes:
          bindDN: "cn=svc-global,dc=global,dc=com"
          url: "ldaps://ldap-global.example.com/dc=global,dc=com"
          email:
            - mail-global
          id:
            - dn-global
          name:
            - cn-global
          preferredUsername:
            - uid-global
    services:
      global:
        url: servicesGlobalUrl-global
      certManager:
        defaultClusterIssuer: certManagerDefaultClusterIssuer-global
      crossplane:
        kubeVaultProviderConfigName: crossplaneKubeVaultProviderConfigName-global
        kubeKeycloakProviderConfigName: crossplaneKubeKeycloakProviderConfigName-global
      externalSecretsOperator:
        defaultClusterSecretStore: ESODefaultClusterSecretStore-global
      keycloak:
        url: keycloakUrl-global
        realm: keycloakName-global
      metallb:
        namespace: metallbNamespace-global
        l2interface: metallbL2Interface-global
      quay:
        host: quayHost-global
      vault:
        kubeAuthMountPath: vaultKubeAuthMountPath-global
        name: vaultName-global
        url: vaultUrl-global
        KVmountPlatform: vaultKVmountPlatform-global
    caCertificates:
      override.crt: |
        -----BEGIN CERTIFICATE-----
        global
        -----END CERTIFICATE-----
      global.crt: |
        -----BEGIN CERTIFICATE-----
        global
        -----END CERTIFICATE-----
