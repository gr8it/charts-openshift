# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

customer: customer-local
customerName: customerName-local
repoURL: repoURL-local
repoTargetRevision: repoTargetRevision-local 
environment: environment-local
environmentShort: environmentShort-local
cluster:
  name: clusterName-local
  acmName: clusterAcmName-local
  type: clusterType-local
  rootDomain: clusterRootDomain-local
  baseDomain: clusterBaseDomain-local
  appsDomain: clusterAppsDomain-local
  apiURL: clusterApiURL-local
  kubeVersion: clusterKubeVersion-local
  apiVersions:
    - clusterApiVersions-local
  services:
    local:
      url: clusterServicesLocalUrl-local
    override:
      url: clusterServicesOverrideUrl-local
  isHub: false
  runsApps: false
proxy: proxy-local
noProxy: noProxy-local
proxyCIDRs:
  - proxyIP-local1
  - proxyIP-local2
ntpServers:
  - ntp-local1
  - ntp-local2
sshAuthorizedKeys:
  - ssh-ed25519 AAAA local1-key
  - ssh-ed25519 AAAA local2-key
imageProxy:
  host: local.example.com
  sources:
    - quay.io-local
adIntegration:
  name: AD Login local
  ldap:
    bindDN: "cn=svc-local,dc=local,dc=com"
    url: "ldaps://ad-local.example.com/dc=local,dc=com"
    insecure: true
    attributes:
      email:
        - mail-local
      id:
        - sAMAccountName-local
      name:
        - cn-local
      preferredUsername:
        - sAMAccountName-local
ldapIntegration:
  name: LDAP Login local
  ldap:
    bindDN: "cn=svc-local,dc=local,dc=com"
    url: "ldaps://ldap-local.example.com/dc=local,dc=com"
    insecure: true
    attributes:
      email:
        - mail-local
      id:
        - dn-local
      name:
        - cn-local
      preferredUsername:
        - uid-local
services:
  local:
    url: servicesLocaltUrl-local
  certManager:
    defaultClusterIssuer: certManagerDefaultClusterIssuer-local
  crossplane:
    kubeVaultProviderConfigName: crossplaneKubeVaultProviderConfigName-local
    kubeKeycloakProviderConfigName: crossplaneKubeKeycloakProviderConfigName-local
  externalSecretsOperator:
    defaultClusterSecretStore: ESODefaultClusterSecretStore-local
  keycloak:
    url: keycloakUrl-local
    realm: keycloakName-local
  metallb:
    namespace: metallbNamespace-local
    l2interface: metallbL2Interface-local
  quay:
    host: quayHost-local
  vault:
    kubeAuthMountPath: vaultKubeAuthMountPath-local
    name: vaultName-local
    url: vaultUrl-local
    KVmountPlatform: vaultKVmountPlatform-local
caCertificates:
  override.crt: |
    -----BEGIN CERTIFICATE-----
    local
    -----END CERTIFICATE-----
  local.crt: |
    -----BEGIN CERTIFICATE-----
    local
    -----END CERTIFICATE-----
