apiVersion: flows.netobserv.io/v1beta2
kind: FlowCollector
metadata:
  name: cluster
  labels:
    {{- include "netobserv-config.labels" . | nindent 4 }}
spec:
  namespace: {{ .Release.Namespace }}
  deploymentModel: Direct
  agent:
    type: eBPF
    ebpf:
      sampling: {{ .Values.flowCollector.agent.ebpf.sampling }}
      {{- with .Values.flowCollector.agent.ebpf.features }}
      features:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.flowCollector.agent.ebpf.privileged }}
      privileged: true
      {{- end }}
      resources:
        {{- toYaml .Values.flowCollector.agent.ebpf.resources | nindent 8 }}
  processor:
    resources:
      {{- toYaml .Values.flowCollector.processor.resources | nindent 6 }}
    {{- if or .Values.flowCollector.processor.healthRules .Values.prometheusRule.enabled }}
    metrics:
      {{- with .Values.flowCollector.processor.healthRules }}
      healthRules:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.prometheusRule.enabled }}
      disableAlerts:
        - NetObservNoFlows
        - NetObservLokiError
      {{- end }}
    {{- end }}
  loki:
    enable: true
    mode: LokiStack
    lokiStack:
      name: {{ include "netobserv-config.fullname" . }}
      namespace: {{ .Release.Namespace }}
  consolePlugin:
    enable: true
