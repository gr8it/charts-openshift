suite: Snapshot test
templates:
  - templates/*
values:
  - ../values.example.yaml
release:
  name: netobserv-config
  namespace: netobserv

tests:
  - it: manifests should match snapshot
    asserts:
      - matchSnapshot: {}

  - it: eBPF features are rendered when set
    template: templates/flowcollector.yaml
    asserts:
      - equal:
          path: spec.agent.ebpf.features
          value:
            - DNSTracking
            - FlowRTT
            - TLSTracking
            - PacketDrop

  - it: eBPF features are omitted when empty
    template: templates/flowcollector.yaml
    set:
      flowCollector.agent.ebpf.features: []
    asserts:
      - notExists:
          path: spec.agent.ebpf.features

  - it: privileged agent and PacketDrop are rendered when set
    template: templates/flowcollector.yaml
    asserts:
      - equal:
          path: spec.agent.ebpf.privileged
          value: true
      - contains:
          path: spec.agent.ebpf.features
          content: PacketDrop

  - it: privileged is omitted by default
    template: templates/flowcollector.yaml
    set:
      flowCollector.agent.ebpf.privileged: false
    asserts:
      - notExists:
          path: spec.agent.ebpf.privileged

  - it: health rules are rendered under processor metrics
    template: templates/flowcollector.yaml
    asserts:
      - equal:
          path: spec.processor.metrics.healthRules[0].template
          value: PacketDropsByDevice
      - equal:
          path: spec.processor.metrics.healthRules[0].mode
          value: Recording
      - equal:
          path: spec.processor.metrics.healthRules[0].variants[0].groupBy
          value: Node

  - it: processor metrics are omitted when no health rules are set
    template: templates/flowcollector.yaml
    set:
      flowCollector.processor.healthRules: []
      prometheusRule.enabled: false
    asserts:
      - notExists:
          path: spec.processor.metrics

  - it: alerts carry severity, vendor and team labels
    template: templates/prometheusrule.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.groups[0].rules[0].labels
          value:
            severity: warning
            vendor: aspecta
            team: platform
      - equal:
          path: spec.groups[0].rules[3].labels
          value:
            severity: warning
            vendor: aspecta
            team: platform
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4

  - it: operator copies of the self-health alerts are disabled when the rule is on
    template: templates/flowcollector.yaml
    asserts:
      - equal:
          path: spec.processor.metrics.disableAlerts
          value:
            - NetObservNoFlows
            - NetObservLokiError

  - it: no rule and no disableAlerts when the rule is off
    set:
      prometheusRule.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/prometheusrule.yaml
      - notExists:
          path: spec.processor.metrics.disableAlerts
        template: templates/flowcollector.yaml
