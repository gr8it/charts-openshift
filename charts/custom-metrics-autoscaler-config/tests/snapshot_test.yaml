suite: Snapshot test
templates:
  - templates/*
values:
  - ../values.example.yaml
release:
  name: custom-metrics-autoscaler-config
  namespace: keda

tests:
  - it: manifests should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: omits the HTTP add-on when disabled
    set:
      httpAddon:
        enabled: false
    asserts:
      - notExists:
          path: spec.httpAddon
