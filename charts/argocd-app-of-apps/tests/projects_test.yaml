# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: AppProjects
templates:
  - templates/projects.yaml
values:
  - ../values.example.yaml
release:
  name: argocd-app-of-apps
  namespace: apc-gitops

tests:
  - it: should not add a default sync wave to project annotations
    documentSelector:
      path: metadata.name
      value: cluster-config
    asserts:
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
      - equal:
          path: metadata.annotations.project
          value: test
      - equal:
          path: metadata.name
          value: cluster-config

  - it: should preserve an explicitly provided project sync wave
    documentSelector:
      path: metadata.name
      value: cluster-config
    set:
      projects:
        cluster-config:
          annotations:
            argocd.argoproj.io/sync-wave: "4"
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "4"
      - equal:
          path: metadata.annotations.project
          value: test

  - it: should omit metadata annotations when none are provided
    documentSelector:
      path: metadata.name
      value: tenants
    asserts:
      - notExists:
          path: metadata.annotations
