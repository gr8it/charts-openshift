# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: AppProjects
templates:
  - templates/projects.yaml
values:
  - ../values.example.yaml
release:
  name: argocd-app-of-apps
  namespace: apc-gitops

tests:
  - it: should create projects before applications by default
    documentSelector:
      path: metadata.name
      value: cluster-config
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      - equal:
          path: metadata.annotations.project
          value: test
      - equal:
          path: metadata.name
          value: cluster-config

  - it: should preserve project annotations alongside the default sync wave
    documentSelector:
      path: metadata.name
      value: cluster-config
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      - equal:
          path: metadata.annotations.project
          value: test
