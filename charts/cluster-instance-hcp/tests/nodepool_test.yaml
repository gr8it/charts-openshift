# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: cluster-instance-hcp NodePool
templates:
  - templates/nodepool.yaml
values:
  - ../values.lint.yaml
release:
  name: cluster-instance-hcp
  namespace: mycluster

tests:
  - it: should name NodePool as nodepool-<clusterName>-1
    set:
      clusterName: mycluster
    asserts:
      - equal:
          path: metadata.name
          value: nodepool-mycluster-1
      - equal:
          path: spec.clusterName
          value: mycluster

  - it: should sync after ManagedCluster
    set:
      clusterName: mycluster
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "10"

  - it: should include base machineconfig refs
    set:
      clusterName: mycluster
    asserts:
      - contains:
          path: spec.config
          content:
            name: machineconfig-chrony
      - contains:
          path: spec.config
          content:
            name: machineconfig-logind
      - contains:
          path: spec.config
          content:
            name: kubeletconfig-worker
      - notContains:
          path: spec.config
          content:
            name: machineconfig-mirror-registries

  - it: should include mirror-registries machineconfig when imageProxy.host is set in global
    set:
      clusterName: mycluster
      global.apc.imageProxy:
        host: my-registry.example.com
    asserts:
      - contains:
          path: spec.config
          content:
            name: machineconfig-mirror-registries

  - it: should set replicas from nodePool.replicas
    set:
      clusterName: mycluster
      nodePool.replicas: 6
    asserts:
      - equal:
          path: spec.replicas
          value: 6

  - it: should default the NodePool release image to releaseImage
    set:
      clusterName: mycluster
      releaseImage: quay.io/openshift-release-dev/ocp-release:4.19.10-multi
    asserts:
      - equal:
          path: spec.release.image
          value: quay.io/openshift-release-dev/ocp-release:4.19.10-multi

  - it: should allow NodePool release to be upgraded separately
    set:
      clusterName: mycluster
      releaseImage: quay.io/openshift-release-dev/ocp-release:4.19.11-multi
      nodePool.releaseImage: quay.io/openshift-release-dev/ocp-release:4.19.10-multi
    asserts:
      - equal:
          path: spec.release.image
          value: quay.io/openshift-release-dev/ocp-release:4.19.10-multi
