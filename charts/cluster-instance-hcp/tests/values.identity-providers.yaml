global:
  apc:
    identityProviders:
      - name: Example LDAP
        type: LDAP
        mappingMethod: claim
        ldap:
          url: ldaps://ldap.example.com/dc=example,dc=com?uid
          bindDN: cn=ldap-service,dc=example,dc=com
          bindPassword:
            name: ldap-bind-secret
      - name: Example Active Directory
        type: LDAP
        mappingMethod: claim
        ldap:
          url: ldaps://ad.example.com/dc=example,dc=com?sAMAccountName
          bindPassword:
            name: ad-bind-secret
          attributes:
            id:
              - sAMAccountName
            preferredUsername:
              - sAMAccountName
      - name: Example Microsoft Entra ID
        type: OpenID
        mappingMethod: claim
        openID:
          clientID: example-client-id
          clientSecret:
            name: entra-id-secret
          issuer: https://login.microsoftonline.com/example-tenant-id/v2.0
          extraScopes:
            - email
            - profile
          claims:
            preferredUsername:
              - preferred_username
