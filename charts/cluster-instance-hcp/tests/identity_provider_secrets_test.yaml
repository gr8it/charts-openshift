# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: cluster-instance-hcp identity provider ExternalSecrets
templates:
  - templates/externalsecret-identity-providers.yaml
values:
  - ../values.lint.yaml
  - ./values.identity-providers.yaml
release:
  name: cluster-instance-hcp
  namespace: mycluster

tests:
  - it: should create a secret for each identity provider with a secret reference
    set:
      clusterName: mycluster
    asserts:
      - hasDocuments:
          count: 3

  - it: should create LDAP bind password ExternalSecret
    template: templates/externalsecret-identity-providers.yaml
    documentIndex: 0
    set:
      clusterName: mycluster
    asserts:
      - equal:
          path: metadata.name
          value: ldap-bind-secret
      - equal:
          path: spec.target.creationPolicy
          value: Orphan
      - equal:
          path: spec.target.deletionPolicy
          value: Retain
      - equal:
          path: spec.data[0].secretKey
          value: bindPassword
      - equal:
          path: spec.data[0].remoteRef.key
          value: apc-platform/p/hcp/mycluster/identityProvider/ldap-bind-secret
      - equal:
          path: spec.data[0].remoteRef.property
          value: bindPassword

  - it: should create AD bind password ExternalSecret
    template: templates/externalsecret-identity-providers.yaml
    documentIndex: 1
    set:
      clusterName: mycluster
    asserts:
      - equal:
          path: metadata.name
          value: ad-bind-secret
      - equal:
          path: spec.data[0].secretKey
          value: bindPassword
      - equal:
          path: spec.data[0].remoteRef.key
          value: apc-platform/p/hcp/mycluster/identityProvider/ad-bind-secret

  - it: should create OpenID client secret ExternalSecret
    template: templates/externalsecret-identity-providers.yaml
    documentIndex: 2
    set:
      clusterName: mycluster
    asserts:
      - equal:
          path: metadata.name
          value: entra-id-secret
      - equal:
          path: spec.data[0].secretKey
          value: clientSecret
      - equal:
          path: spec.data[0].remoteRef.key
          value: apc-platform/p/hcp/mycluster/identityProvider/entra-id-secret
      - equal:
          path: spec.data[0].remoteRef.property
          value: clientSecret

  - it: should map HTPasswd fileData to the required htpasswd Secret key
    set:
      clusterName: mycluster
      global.apc.identityProviders:
        - name: Example HTPasswd
          type: HTPasswd
          htpasswd:
            fileData:
              name: htpasswd-secret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: htpasswd-secret
      - equal:
          path: spec.data[0].secretKey
          value: htpasswd
      - equal:
          path: spec.data[0].remoteRef.property
          value: fileData

  - it: should combine Keystone TLS credentials when both use the same Secret
    set:
      clusterName: mycluster
      global.apc.identityProviders:
        - name: Example Keystone
          type: Keystone
          keystone:
            tlsClientCert:
              name: keystone-tls
            tlsClientKey:
              name: keystone-tls
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: keystone-tls
      - contains:
          path: spec.data
          content:
            secretKey: tls.crt
            remoteRef:
              key: apc-platform/p/hcp/mycluster/identityProvider/keystone-tls
              property: tlsClientCert
      - contains:
          path: spec.data
          content:
            secretKey: tls.key
            remoteRef:
              key: apc-platform/p/hcp/mycluster/identityProvider/keystone-tls
              property: tlsClientKey

  - it: should create separate Keystone TLS Secrets when certificate and key names differ
    documentSelector:
      path: metadata.name
      value: keystone-cert
    set:
      clusterName: mycluster
      global.apc.identityProviders:
        - name: Example Keystone
          type: Keystone
          keystone:
            tlsClientCert:
              name: keystone-cert
            tlsClientKey:
              name: keystone-key
    asserts:
      - equal:
          path: metadata.name
          value: keystone-cert
      - equal:
          path: spec.data[0].secretKey
          value: tls.crt
      - equal:
          path: spec.data[0].remoteRef.property
          value: tlsClientCert

  - it: should map the Keystone TLS key when its Secret name differs
    documentSelector:
      path: metadata.name
      value: keystone-key
    set:
      clusterName: mycluster
      global.apc.identityProviders:
        - name: Example Keystone
          type: Keystone
          keystone:
            tlsClientCert:
              name: keystone-cert
            tlsClientKey:
              name: keystone-key
    asserts:
      - equal:
          path: spec.data[0].secretKey
          value: tls.key
      - equal:
          path: spec.data[0].remoteRef.property
          value: tlsClientKey

  - it: should combine BasicAuth TLS credentials when both use the same Secret
    set:
      clusterName: mycluster
      global.apc.identityProviders:
        - name: Example BasicAuth
          type: BasicAuth
          basicAuth:
            tlsClientCert:
              name: basicauth-tls
            tlsClientKey:
              name: basicauth-tls
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: basicauth-tls
      - contains:
          path: spec.data
          content:
            secretKey: tls.crt
            remoteRef:
              key: apc-platform/p/hcp/mycluster/identityProvider/basicauth-tls
              property: tlsClientCert
      - contains:
          path: spec.data
          content:
            secretKey: tls.key
            remoteRef:
              key: apc-platform/p/hcp/mycluster/identityProvider/basicauth-tls
              property: tlsClientKey

  - it: should create separate BasicAuth TLS Secrets when certificate and key names differ
    documentSelector:
      path: metadata.name
      value: basicauth-cert
    set:
      clusterName: mycluster
      global.apc.identityProviders:
        - name: Example BasicAuth
          type: BasicAuth
          basicAuth:
            tlsClientCert:
              name: basicauth-cert
            tlsClientKey:
              name: basicauth-key
    asserts:
      - equal:
          path: metadata.name
          value: basicauth-cert
      - equal:
          path: spec.data[0].secretKey
          value: tls.crt
      - equal:
          path: spec.data[0].remoteRef.property
          value: tlsClientCert

  - it: should map the BasicAuth TLS key when its Secret name differs
    documentSelector:
      path: metadata.name
      value: basicauth-key
    set:
      clusterName: mycluster
      global.apc.identityProviders:
        - name: Example BasicAuth
          type: BasicAuth
          basicAuth:
            tlsClientCert:
              name: basicauth-cert
            tlsClientKey:
              name: basicauth-key
    asserts:
      - equal:
          path: spec.data[0].secretKey
          value: tls.key
      - equal:
          path: spec.data[0].remoteRef.property
          value: tlsClientKey
