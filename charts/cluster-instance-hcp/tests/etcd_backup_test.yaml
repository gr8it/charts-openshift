# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: cluster-instance-hcp etcd backup
templates:
  - templates/etcd-backup-cronjob.yaml
  - templates/etcd-backup-scripts-configmap.yaml
  - templates/etcd-backup-objectbucketclaim.yaml
  - templates/etcd-backup-role.yaml
  - templates/etcd-backup-rolebinding.yaml
  - templates/etcd-backup-serviceaccount.yaml
  - templates/etcd-backup-networkpolicy.yaml
  - templates/etcd-backup-prometheusrule.yaml
values:
  - ../values.lint.yaml
release:
  name: cluster-instance-hcp
  namespace: mycluster

tests:
  - it: should create the CronJob when enabled
    template: templates/etcd-backup-cronjob.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: should use the configured schedule and pause state
    template: templates/etcd-backup-cronjob.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
      etcd.backup.schedule: "15 2 * * *"
      etcd.backup.paused: true
      oseCliImageTag: "4.20"
    asserts:
      - equal:
          path: metadata.name
          value: etcd-hcp-backup-mycluster
      - equal:
          path: metadata.namespace
          value: mycluster-mycluster
      - equal:
          path: spec.schedule
          value: "15 2 * * *"
      - equal:
          path: spec.suspend
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: etcd-hcp-backup-mycluster
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].image
          value: registry.redhat.io/openshift4/ose-cli:v4.20

  - it: should create the scripts ConfigMap when enabled
    template: templates/etcd-backup-scripts-configmap.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: should create the Role when enabled
    template: templates/etcd-backup-role.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: should create the RoleBinding when enabled
    template: templates/etcd-backup-rolebinding.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: should create the ServiceAccount when enabled
    template: templates/etcd-backup-serviceaccount.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: should create the NetworkPolicy when enabled
    template: templates/etcd-backup-networkpolicy.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: should create the PrometheusRule when enabled
    template: templates/etcd-backup-prometheusrule.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: should alert for old successes and for missing or never-created success series
    template: templates/etcd-backup-prometheusrule.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: 'kube_cronjob_status_last_successful_time\{namespace="mycluster-mycluster", cronjob="etcd-hcp-backup-mycluster"\}'
      - matchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: 'kube_cronjob_created\{namespace="mycluster-mycluster", cronjob="etcd-hcp-backup-mycluster"\}'
      - matchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: 'absent\(kube_cronjob_status_last_successful_time\{namespace="mycluster-mycluster", cronjob="etcd-hcp-backup-mycluster"\}\)'

  - it: should place all etcd backup resources in the Hosted Control Plane namespace
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
      etcd.backup.objectBucketClaim.create: true
    asserts:
      - equal:
          path: metadata.namespace
          value: mycluster-mycluster

  - it: should bind the Role to the ServiceAccount in the Hosted Control Plane namespace
    template: templates/etcd-backup-rolebinding.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
    asserts:
      - equal:
          path: subjects[0].namespace
          value: mycluster-mycluster

  - it: should allow etcd access only from backup pods in the same namespace
    template: templates/etcd-backup-networkpolicy.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
    asserts:
      - notExists:
          path: spec.ingress[0].from[0].namespaceSelector
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/instance"]
          value: etcd-hcp-backup-mycluster

  - it: should scope the job failure alert to the Hosted Control Plane namespace
    template: templates/etcd-backup-prometheusrule.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'kube_job_failed\{namespace="mycluster-mycluster", job_name=~"etcd-hcp-backup-mycluster-\.\*"'

  - it: should not create etcd backup resources when disabled
    template: templates/etcd-backup-cronjob.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create an ObjectBucketClaim when requested
    template: templates/etcd-backup-objectbucketclaim.yaml
    set:
      clusterName: mycluster
      etcd.backup.enabled: true
      etcd.backup.objectBucketClaim.create: true
    asserts:
      - equal:
          path: apiVersion
          value: objectbucket.io/v1alpha1
      - equal:
          path: kind
          value: ObjectBucketClaim
      - equal:
          path: metadata.name
          value: etcd-hcp-mycluster-backup
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false
      - equal:
          path: spec.bucketName
          value: etcd-hcp-mycluster-backup
      - notExists:
          path: spec.generateBucketName
      - equal:
          path: spec.storageClassName
          value: ocs-storagecluster-ceph-rgw
