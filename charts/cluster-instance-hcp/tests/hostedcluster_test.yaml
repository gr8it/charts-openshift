# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: cluster-instance-hcp HostedCluster
templates:
  - templates/hostedcluster.yaml
values:
  - globals.yaml
release:
  name: cluster-instance-hcp
  namespace: mycluster

tests:
  - it: should set cluster name from clusterName value
    set:
      clusterName: mycluster
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
    asserts:
      - equal:
          path: metadata.name
          value: mycluster
      - equal:
          path: spec.infraID
          value: mycluster
      - equal:
          path: spec.dns.baseDomain
          value: cloud.example.com

  - it: should set infrastructure namespace to infrastructure-<clusterName> by default
    set:
      clusterName: mycluster
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
    asserts:
      - equal:
          path: spec.platform.agent.agentNamespace
          value: infrastructure-mycluster

  - it: should use custom infrastructureNamespace when set
    set:
      clusterName: mycluster
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
      infrastructureNamespace: custom-infra-ns
    asserts:
      - equal:
          path: spec.platform.agent.agentNamespace
          value: custom-infra-ns

  - it: should construct service addresses from clusterName and rootDomain
    set:
      clusterName: mycluster
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
    asserts:
      - contains:
          path: spec.services
          content:
            service: OAuthServer
            servicePublishingStrategy:
              type: NodePort
              nodePort:
                address: oauth.mycluster.cloud.example.com
                port: 30102

  - it: should default networkType to OVNKubernetes
    set:
      clusterName: mycluster
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
    asserts:
      - equal:
          path: spec.networking.networkType
          value: OVNKubernetes

  - it: should default clusterSet to clusterName with trailing digits removed
    set:
      clusterName: prod01
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
    asserts:
      - equal:
          path: metadata.labels["cluster.open-cluster-management.io/clusterset"]
          value: prod

  - it: should use explicit clusterSet when set
    set:
      clusterName: prod01
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
      clusterSet: myclusterset
    asserts:
      - equal:
          path: metadata.labels["cluster.open-cluster-management.io/clusterset"]
          value: myclusterset

  - it: should include proxy config and CA bundle reference when global proxy is configured
    set:
      clusterName: mycluster
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
      global.apc.proxy: http://proxy.example.com:8080
      global.apc.noProxy: .example.com,.svc
    asserts:
      - equal:
          path: spec.additionalTrustBundle.name
          value: user-ca-bundle
      - equal:
          path: spec.configuration.proxy.httpProxy
          value: http://proxy.example.com:8080
      - equal:
          path: spec.configuration.proxy.trustedCA.name
          value: user-ca-bundle

  - it: should omit proxy config when global proxy is not configured
    set:
      clusterName: mycluster
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
    asserts:
      - notExists:
          path: spec.additionalTrustBundle
      - notExists:
          path: spec.configuration.proxy

  - it: should include imageContentSources when imageProxy.host is set in global
    set:
      clusterName: mycluster
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
      global.apc.imageProxy:
        host: my-registry.example.com
        sources:
          - quay.io
          - docker.io
    asserts:
      - contains:
          path: spec.configuration.image.imageContentSources
          content:
            source: quay.io
            mirrors:
              - my-registry.example.com/quay.io
      - equal:
          path: spec.configuration.image.additionalTrustedCA.name
          value: registry-ca-bundle

  - it: should omit image config when imageProxy.host is not set
    set:
      clusterName: mycluster
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
    asserts:
      - notExists:
          path: spec.configuration.image

  - it: should include AD IDP when adIntegration.enabled is true
    set:
      clusterName: mycluster
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
      global.apc.adIntegration.name: "AD Login"
      global.apc.adIntegration.ldap.attributes.url: "ldaps://ad.example.com/DC=example,DC=com?sAMAccountName"
      global.apc.adIntegration.ldap.attributes.bindDN: "CN=svc,DC=example,DC=com"
    asserts:
      - equal:
          path: spec.configuration.oauth.identityProviders[0].name
          value: "AD Login"
      - equal:
          path: spec.configuration.oauth.identityProviders[0].type
          value: LDAP
      - equal:
          path: spec.configuration.oauth.identityProviders[0].ldap.url
          value: "ldaps://ad.example.com/DC=example,DC=com?sAMAccountName"

  - it: should omit AD IDP when adIntegration.enabled is false
    set:
      clusterName: mycluster
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
    asserts:
      - notExists:
          path: spec.configuration.oauth

  - it: should include apiServer namedCertificates
    set:
      clusterName: mycluster
      services:
        oauthPort: 30102
        konnectivityPort: 30103
        ignitionPort: 30104
        oidcPort: 30101
    asserts:
      - equal:
          path: spec.configuration.apiServer.servingCerts.namedCertificates[0].servingCertificate.name
          value: kube-apiserver-cert
      - contains:
          path: spec.configuration.apiServer.servingCerts.namedCertificates[0].names
          content: api.mycluster.cloud.example.com
      - contains:
          path: spec.configuration.apiServer.servingCerts.namedCertificates[0].names
          content: oauth.mycluster.cloud.example.com
