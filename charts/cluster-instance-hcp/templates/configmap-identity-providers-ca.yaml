{{- $identityProviders := (include "apc-global-overrides.identityProviders" .) | fromYamlArray }}
{{- if $identityProviders }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth-idp-ca-bundle
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-instance-hcp.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- include "apc-global-overrides.caCertificatesBundle" . | nindent 4 }}
{{- end }}
