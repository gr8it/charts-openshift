apiVersion: v1
kind: ConfigMap
metadata:
  name: machineconfig-logind
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-instance-hcp.labels" . | nindent 4 }}
data:
  config: |
    apiVersion: machineconfiguration.openshift.io/v1
    kind: MachineConfig
    metadata:
      labels:
        machineconfiguration.openshift.io/role: worker
      name: 99-worker-logind
    spec:
      config:
        ignition:
          version: 3.4.0
        storage:
          files:
            - path: /etc/systemd/logind.conf.d/10-custom.conf
              mode: 0644
              overwrite: true
              contents:
                # source: "data:text/plain;charset=utf-8;base64,W0xvZ2luXQpTdG9wSWRsZVNlc3Npb25TZWM9OTAwCg=="
                source: "data:text/plain;charset=utf-8;base64,{{ .Values.logindConfig | b64enc }}"
