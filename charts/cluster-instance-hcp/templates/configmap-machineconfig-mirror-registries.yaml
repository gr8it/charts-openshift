{{- if .Values.imageProxy.enabled }}
{{- $registryHost := required "imageProxy.registryHost is required when imageProxy.enabled" .Values.imageProxy.registryHost }}
{{- $toml := "" -}}
{{- range .Values.imageProxy.sources -}}
  {{- $toml = printf "%s[[registry]]\n  prefix = \"\"\n  location = \"%s\"\n  mirror-by-digest-only = false\n\n  [[registry.mirror]]\n    location = \"%s/%s\"\n\n" $toml . $registryHost . -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: machineconfig-mirror-registries
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-instance-hcp.labels" . | nindent 4 }}
data:
  config: |
    apiVersion: machineconfiguration.openshift.io/v1
    kind: MachineConfig
    metadata:
      labels:
        machineconfiguration.openshift.io/role: worker
      name: 99-worker-mirror-by-tag-registries
    spec:
      config:
        ignition:
          version: 3.1.0
        storage:
          files:
            - contents:
                source: data:text/plain;charset=utf-8;base64,{{ $toml | b64enc }}
              filesystem: root
              mode: 420
              path: /etc/containers/registries.conf.d/99-mirror-by-tag-registries.conf
{{- end }}
