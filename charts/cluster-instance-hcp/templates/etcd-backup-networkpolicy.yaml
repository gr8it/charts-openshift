{{- if .Values.etcd.backup.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cluster-instance-hcp.etcdBackup.fullname" . }}
  namespace: {{ include "cluster-instance-hcp.etcdBackup.namespace" . }}
  labels:
    {{- include "cluster-instance-hcp.etcdBackup.labels" . | nindent 4 }}
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: etcd-hcp-backup
              app.kubernetes.io/instance: {{ include "cluster-instance-hcp.etcdBackup.fullname" . }}
      ports:
        - protocol: TCP
          port: 2379
  podSelector:
    matchExpressions:
      - key: statefulset.kubernetes.io/pod-name
        operator: In
        values:
          {{- range $idx := untilStep 0 5 1 }}
          - {{ include "cluster-instance-hcp.etcdBackup.etcdStatefulSetName" $ }}-{{ $idx }}
          {{- end }}
  policyTypes:
    - Ingress
{{- end }}
