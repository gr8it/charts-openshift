{{- $ldapIntegration := (include "apc-global-overrides.ldapIntegration" .) | fromYaml }}
{{- if $ldapIntegration }}
{{- $clusterName := include "cluster-instance-hcp.clusterName" . }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bastion-ldap-bind-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-instance-hcp.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "apc-global-overrides.require-ESODefaultClusterSecretStore" . }}
    kind: ClusterSecretStore
  target:
    name: bastion-ldap-bind-secret
    creationPolicy: Owner
  data:
    - secretKey: bindPassword
      remoteRef:
        key: {{ include "apc-global-overrides.require-vaultKVmountPlatform" . }}/{{ include "apc-global-overrides.require-environmentShort" . }}/hcp/{{ $clusterName }}/ldapIntegration
        property: bindPassword
{{- end }}
