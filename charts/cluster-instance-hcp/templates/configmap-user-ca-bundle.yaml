{{- if include "apc-global-overrides.proxy" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-ca-bundle
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-instance-hcp.labels" . | nindent 4 }}
data:
  ca-bundle.crt: |
    {{- include "apc-global-overrides.caCertificatesBundle" . | nindent 4 }}
{{- end }}
