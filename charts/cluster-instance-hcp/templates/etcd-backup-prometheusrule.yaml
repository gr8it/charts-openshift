{{- if .Values.etcd.backup.enabled }}
{{- $clusterName := include "cluster-instance-hcp.clusterName" . }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "cluster-instance-hcp.etcdBackup.fullname" . }}-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-instance-hcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: etcd-backup
spec:
  groups:
    - name: cronjob.rules
      rules:
        - alert: EtcdBackupJobFailure
          expr: kube_job_failed{namespace="{{ .Release.Namespace }}", job_name=~"{{ include "cluster-instance-hcp.etcdBackup.fullname" . }}-.*", condition="true"} > 0
          labels:
            severity: warning
            vendor: aspecta
            team: platform
          annotations:
            summary: "ETCD backup job for {{ $clusterName }} has failed"
            description: "ETCD backup job for {{ $clusterName }} {{`{{ $labels.namespace }}/{{ $labels.job_name}}`}} has failed."
        - alert: EtcdBackupMissing
          expr: time() - kube_cronjob_status_last_successful_time{namespace="{{ .Release.Namespace }}", cronjob="{{ include "cluster-instance-hcp.etcdBackup.fullname" . }}"} > 129600
          labels:
            severity: critical
            vendor: aspecta
            team: platform
          annotations:
            summary: "ETCD backup for {{ $clusterName }} is missing"
            description: "No successful ETCD backup for {{ $clusterName }} ({{`{{ $labels.namespace }}/{{ $labels.cronjob }}`}}) in the last 36 hours."
{{- end }}
