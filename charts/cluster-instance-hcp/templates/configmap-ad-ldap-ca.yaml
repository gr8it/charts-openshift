{{- if .Values.adIntegration.vaultKey }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ad-ldap-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-instance-hcp.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- required "adIntegration.caCert is required " .Values.adIntegration.caCert | nindent 4 }}
{{- end }}
