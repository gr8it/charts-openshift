{{- if and (include "apc-global-overrides.caCertificatesBundle" .) ((((include "apc-global-overrides.adIntegration" .) | fromYaml).ldap).attributes).url }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ad-ldap-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-instance-hcp.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- include "apc-global-overrides.caCertificatesBundle" . | nindent 4 }}
{{- end }}
