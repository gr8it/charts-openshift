{{- $identityProviders := (include "apc-global-overrides.identityProviders" .) | fromYamlArray }}
{{- $clusterName := include "cluster-instance-hcp.clusterName" . }}
{{- $secrets := dict }}
{{- $secretNames := list }}
{{- range $identityProvider := $identityProviders }}
{{- $credentials := list }}
{{- if eq $identityProvider.type "LDAP" }}
  {{- $secretName := dig "ldap" "bindPassword" "name" "" $identityProvider }}
  {{- if $secretName }}
    {{- $credentials = append $credentials (dict "name" $secretName "secretKey" "bindPassword" "property" "bindPassword") }}
  {{- end }}
{{- else if eq $identityProvider.type "HTPasswd" }}
  {{- $secretName := dig "htpasswd" "fileData" "name" "" $identityProvider }}
  {{- if $secretName }}
    {{- $credentials = append $credentials (dict "name" $secretName "secretKey" "htpasswd" "property" "fileData") }}
  {{- end }}
{{- else if or (eq $identityProvider.type "Keystone") (eq $identityProvider.type "BasicAuth") }}
  {{- $providerType := lower $identityProvider.type }}
  {{- if eq $identityProvider.type "BasicAuth" }}
    {{- $providerType = "basicAuth" }}
  {{- end }}
  {{- range $credential := list (dict "reference" "tlsClientCert" "secretKey" "tls.crt") (dict "reference" "tlsClientKey" "secretKey" "tls.key") }}
    {{- $secretName := dig $providerType $credential.reference "name" "" $identityProvider }}
    {{- if $secretName }}
      {{- $credentials = append $credentials (dict "name" $secretName "secretKey" $credential.secretKey "property" $credential.reference) }}
    {{- end }}
  {{- end }}
{{- else if has (toString $identityProvider.type) (list "GitHub" "GitLab" "Google" "OpenID") }}
  {{- $providerType := lower $identityProvider.type }}
  {{- if eq $identityProvider.type "OpenID" }}
    {{- $providerType = "openID" }}
  {{- end }}
  {{- $secretName := dig $providerType "clientSecret" "name" "" $identityProvider }}
  {{- if $secretName }}
    {{- $credentials = append $credentials (dict "name" $secretName "secretKey" "clientSecret" "property" "clientSecret") }}
  {{- end }}
{{- end }}
{{- range $credentials }}
  {{- $credential := . }}
  {{- $secretName := $credential.name }}
  {{- if not (hasKey $secrets $secretName) }}
    {{- $secretNames = append $secretNames $secretName }}
    {{- $_ := set $secrets $secretName list }}
  {{- end }}
  {{- $secretData := get $secrets $secretName }}
  {{- $credentialExists := false }}
  {{- range $secretData }}
    {{- if and (eq .secretKey $credential.secretKey) (eq .property $credential.property) }}
      {{- $credentialExists = true }}
    {{- end }}
  {{- end }}
  {{- if not $credentialExists }}
    {{- $_ := set $secrets $secretName (append $secretData (dict "secretKey" $credential.secretKey "property" $credential.property)) }}
  {{- end }}
{{- end }}
{{- end }}
{{- range $secretNames }}
{{- $secretName := . }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cluster-instance-hcp.labels" $ | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ include "apc-global-overrides.require-ESODefaultClusterSecretStore" $ }}
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: {{ $secretName }}
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    {{- range get $secrets $secretName }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ include "apc-global-overrides.require-vaultKVmountPlatform" $ }}/{{ include "apc-global-overrides.require-environmentShort" $ }}/hcp/{{ $clusterName }}/identityProvider/{{ $secretName }}
        property: {{ .property }}
    {{- end }}
    {{- end }}
