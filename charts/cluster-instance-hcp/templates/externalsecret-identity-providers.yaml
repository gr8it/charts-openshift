{{- $identityProviders := (include "apc-global-overrides.identityProviders" .) | fromYamlArray }}
{{- $clusterName := include "cluster-instance-hcp.clusterName" . }}
{{- range $identityProvider := $identityProviders }}
{{- $secretName := "" }}
{{- $secretKey := "" }}
{{- $secretCert := "" }}
{{- if eq $identityProvider.type "LDAP" }}
{{- $secretName = dig "ldap" "bindPassword" "name" "" $identityProvider }}
{{- if $secretName }}{{- $secretKey = "bindPassword" }}{{- end }}
{{- else if eq $identityProvider.type "HTPasswd" }}
{{- $secretName = dig "htpasswd" "fileData" "name" "" $identityProvider }}
{{- if $secretName }}{{- $secretKey = "fileData" }}{{- end }}
{{- else if eq $identityProvider.type "Keystone" }}
{{- $secretName = dig "keystone" "tlsClientCert" "name" "" $identityProvider }}
{{- if $secretName }}
{{- $secretKey = "tlsClientKey" }}
{{- $secretCert = "tlsClientCert" }}
{{- end }}
{{- else if eq $identityProvider.type "BasicAuth" }}
{{- $secretName = dig "basicAuth" "clientSecret" "name" "" $identityProvider }}
{{- if $secretName }}{{- $secretKey = "clientSecret" }}{{- end }}
{{- else if eq $identityProvider.type "GitHub" }}
{{- $secretName = dig "github" "clientSecret" "name" "" $identityProvider }}
{{- if $secretName }}{{- $secretKey = "clientSecret" }}{{- end }}
{{- else if eq $identityProvider.type "GitLab" }}
{{- $secretName = dig "gitlab" "clientSecret" "name" "" $identityProvider }}
{{- if $secretName }}{{- $secretKey = "clientSecret" }}{{- end }}
{{- else if eq $identityProvider.type "Google" }}
{{- $secretName = dig "google" "clientSecret" "name" "" $identityProvider }}
{{- if $secretName }}{{- $secretKey = "clientSecret" }}{{- end }}
{{- else if eq $identityProvider.type "OpenID" }}
{{- $secretName = dig "openID" "clientSecret" "name" "" $identityProvider }}
{{- if $secretName }}{{- $secretKey = "clientSecret" }}{{- end }}
{{- end }}
{{- if and $secretName $secretKey }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cluster-instance-hcp.labels" $ | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ include "apc-global-overrides.require-ESODefaultClusterSecretStore" $ }}
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: {{ $secretName }}
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ include "apc-global-overrides.require-vaultKVmountPlatform" $ }}/{{ include "apc-global-overrides.require-environmentShort" $ }}/hcp/{{ $clusterName }}/identityProvider/{{ $secretName }}
        property: {{ $secretKey }}
    {{- if $secretCert }}
    - secretKey: {{ $secretCert }}
      remoteRef:
        key: {{ include "apc-global-overrides.require-vaultKVmountPlatform" $ }}/{{ include "apc-global-overrides.require-environmentShort" $ }}/hcp/{{ $clusterName }}/identityProvider/{{ $secretName }}
        property: {{ $secretCert }}
    {{- end }}
{{- end }}
{{- end }}
