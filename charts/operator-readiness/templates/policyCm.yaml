{{- $policy := .Values.policy | default dict -}}
{{- $_ := required "policy.strategy is required" $policy.strategy -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "operator-readiness.name" . }}-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator-readiness.labels" . | nindent 4 }}
data:
  policy.yaml: |
    {{- toYaml $policy | nindent 4 }}
