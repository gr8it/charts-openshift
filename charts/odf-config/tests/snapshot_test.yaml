suite: Snapshot test
templates:
  - templates/*
release:
  name: odf-config

tests:
  - it: manifests should match snapshot (defaults, no config)
    asserts:
      - matchSnapshot: {}

  - it: renders ODF config on a standalone cluster
    set:
      additionalNetworks:
        - name: odf
          type: Raw
          rawCNIConfig: |-
            {
              "cniVersion": "0.3.1",
              "name": "odf",
              "type": "macvlan",
              "master": "bond1.100",
              "mode": "bridge",
              "ipam": {
                "type": "whereabouts",
                "range": "192.0.2.0/25",
                "range_start": "192.0.2.10",
                "range_end": "192.0.2.126"
              }
            }
      storageCluster:
        name: ocs-storagecluster
        resources:
          mds:
            limits:
              memory: 20Gi
            requests:
              memory: 20Gi
      machineConfig:
        enabled: true
        configMap:
          name: machineconfig-99-bond1-promisc
    asserts:
      - matchSnapshot: {}

  - it: renders exactly one StorageCluster with only spec.resources set, even with multiple resource entries
    template: templates/storagecluster.yaml
    set:
      storageCluster:
        name: ocs-storagecluster
        resources:
          mds:
            limits:
              memory: 20Gi
            requests:
              memory: 20Gi
          mgr:
            limits:
              cpu: "2"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StorageCluster
      - equal:
          path: spec
          value:
            resources:
              mds:
                limits:
                  memory: 20Gi
                requests:
                  memory: 20Gi
              mgr:
                limits:
                  cpu: "2"

  - it: renders MachineConfig as a hosted-cluster ConfigMap on a hub cluster
    set:
      machineConfig:
        enabled: true
        configMap:
          name: machineconfig-99-bond1-promisc
      global.apc.cluster.isHub: true
      global.apc.cluster.name: example-spoke
    asserts:
      - matchSnapshot: {}
