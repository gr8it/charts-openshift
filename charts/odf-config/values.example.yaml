additionalNetworks:
  - name: odf
    type: Raw
    rawCNIConfig: |-
      {
        "cniVersion": "0.3.1",
        "name": "odf",
        "type": "macvlan",
        "master": "bond1.100",
        "mode": "bridge",
        "ipam": {
          "type": "whereabouts",
          "range": "192.0.2.0/25",
          "range_start": "192.0.2.10",
          "range_end": "192.0.2.126"
        }
      }

storageCluster:
  name: ocs-storagecluster
  resources:
    mds:
      limits:
        memory: 20Gi
      requests:
        memory: 20Gi

machineConfig:
  enabled: true
  configMap:
    name: machineconfig-99-bond1-promisc
