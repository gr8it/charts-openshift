additionalNetworks:
  - name: odf
    type: Raw
    rawCNIConfig: |-
      {
        "cniVersion": "0.3.1",
        "name": "odf",
        "type": "macvlan",
        "master": "bond1.100",
        "mode": "bridge",
        "ipam": {
          "type": "whereabouts",
          "range": "192.0.2.0/25",
          "range_start": "192.0.2.10",
          "range_end": "192.0.2.126"
        }
      }

nodeNetworkConfigurationPolicy:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  interfaces:
    - name: bond1
      type: bond
      state: up
      link-aggregation:
        mode: 802.3ad
        port:
          - eno1
          - eno2
    - name: bond1.100
      type: vlan
      state: up
      vlan:
        base-iface: bond1
        id: 100

storageCluster:
  name: ocs-storagecluster
  nodeCount: 3
  localVolumeSetCount: 2
  deviceMinSize: 6000Gi
  resourceProfile: balanced
  resources:
    mds:
      limits:
        memory: 20Gi
      requests:
        memory: 20Gi
  cephCluster: {}

machineConfig:
  enabled: true
  configMap:
    name: machineconfig-99-bond1-promisc
