{{- with .Values.machineConfig.spec }}
{{- if $.Values.machineConfig.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Values.machineConfig.configMap.name }}
  namespace: {{ $.Values.machineConfig.configMap.namespace }}
data:
  config: |
    apiVersion: machineconfiguration.openshift.io/v1
    kind: MachineConfig
    metadata:
      labels:
        {{- $.Values.machineConfig.labels | toYaml | nindent 8 }}
      name: {{ $.Values.machineConfig.name }}
    spec:
      {{- toYaml . | nindent 6 }}
{{- else }}
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    {{- $.Values.machineConfig.labels | toYaml | nindent 4 }}
  name: {{ $.Values.machineConfig.name }}
spec:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
