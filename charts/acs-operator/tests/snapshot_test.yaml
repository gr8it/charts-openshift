suite: Snapshot test
templates:
  - charts/*/templates/*
release:
  name: acs-operator
  namespace: rhacs-operator

tests:
  - it: manifests should match snapshot
    asserts:
      - matchSnapshot: {}

  - it: should subscribe to the RHACS operator starting at 4.11.4
    asserts:
      - isKind:
          of: OperatorPolicy
      - equal:
          path: spec.subscription.name
          value: rhacs-operator
      - equal:
          path: spec.subscription.channel
          value: stable
      - equal:
          path: spec.subscription.startingCSV
          value: rhacs-operator.v4.11.4
      - equal:
          path: spec.upgradeApproval
          value: Automatic

  - it: should allow every intermediate version on the upgrade path to 4.11.4
    asserts:
      - equal:
          path: spec.versions
          value:
            - rhacs-operator.v4.8.7
            - rhacs-operator.v4.9.3
            - rhacs-operator.v4.10.9
            - rhacs-operator.v4.11.4
