{{- if .Values.instanceReport.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ (index .Values "mongodb-kubernetes").operator.name }}-report
  labels:
    {{- include "mongodb-operator-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: instance-report
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch"]
  - apiGroups: ["mongodbcommunity.mongodb.com"]
    resources: ["mongodbcommunity"]
    verbs: ["get", "list", "watch"]
{{- end }}
