image:
  repository: registry.example.com/apc/readiness-engine  # mirror of ghcr.io/gr8it/operators-guard
interval: 1h
historyKeep: 24

policy:
  strategy: eus
  brief:
    excludeClusters: []
  # Supply chartsRepo, confRepos and ticketPrefix at runtime (engine/README.md).
  # Without destinations, the generated order asks before any edits.
  workflow:
    push: ask
  owners:
    openshift-gitops-operator: platform-team
  defaultOwner: unassigned
  lockstep: [kubevirt-hyperconverged, odf-operator]
  graph:
    conditionalRisks: block
  unsupportedWindow:
    allow: [redhat-oadp-operator]
  # drift checks (all optional): minimum versions the platform needs, thresholds for BEHIND / SUPPORT-ENDING
  minVersions:
    openshift-gitops-operator: "1.21.0"
  drift:
    maxDaysBehind: 90
    supportWarnDays: 180
  exceptions:
    - package: external-secrets
      reason: upstream, no OCP support matrix
      owner: platform-team
      expires: "2027-03-31"

snapshot:
  repository: registry.example.com/apc/operator-readiness-snapshot
  pushSecret: operator-readiness-quay-push

grafanaDashboard:
  enabled: true
  instanceName: apc-grafana

# Copy /var/cache/readiness/brief from the collector after a successful run.
brief:
  enabled: true
