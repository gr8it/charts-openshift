---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "operators-guard.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operators-guard.labels" . | nindent 4 }}
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ include "operators-guard.name" . }}"}}
