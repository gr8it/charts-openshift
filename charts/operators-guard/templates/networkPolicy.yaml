{{- /* allows egress to the proxy; platform namespaces deny it by default (BaselineAdminNetworkPolicy) */ -}}
{{- with (include "apc-global-overrides.proxyCIDRs" . | fromYamlArray) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "operators-guard.name" $ }}-allow-proxy
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "operators-guard.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "operators-guard.selectorLabels" $ | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
{{- end }}
