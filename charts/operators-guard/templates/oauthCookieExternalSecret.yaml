---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "operators-guard.name" . }}-oauth-cookie
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operators-guard.labels" . | nindent 4 }}
spec:
  refreshInterval: "0"
  target:
    name: {{ include "operators-guard.name" . }}-oauth-cookie
    creationPolicy: Owner
    template:
      metadata:
        labels:
          {{- include "operators-guard.labels" . | nindent 10 }}
      data:
        cookie-secret: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "operators-guard.name" . }}-oauth-cookie
