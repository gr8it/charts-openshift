{{- if .Values.grafanaDashboard.enabled }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "operators-guard.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operators-guard.labels" . | nindent 4 }}
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: {{ .Values.grafanaDashboard.instanceName }}
  json: |
    {{- .Files.Get "dashboards/operators-guard.json" | nindent 4 }}
{{- end }}
