---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "operators-guard.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operators-guard.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ include "operators-guard.name" . }}-tls
spec:
  selector:
    {{- include "operators-guard.selectorLabels" . | nindent 4 }}
  ports:
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  - name: https
    port: 8443
    targetPort: https
    protocol: TCP
