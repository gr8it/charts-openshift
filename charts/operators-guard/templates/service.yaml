---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "operators-guard.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operators-guard.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "operators-guard.selectorLabels" . | nindent 4 }}
  ports:
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
