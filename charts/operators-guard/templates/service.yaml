---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "operator-readiness.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator-readiness.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "operator-readiness.selectorLabels" . | nindent 4 }}
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "operator-readiness.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator-readiness.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "operator-readiness.selectorLabels" . | nindent 6 }}
  endpoints:
  - port: metrics
    interval: 5m
