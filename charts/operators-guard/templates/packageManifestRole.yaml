---
# Head each catalog serves for an installed package: the hub's PackageManifests (and the CatalogSource image matched
# against its ClusterCatalog) are read directly, only in the namespace of the default catalogs. Managed clusters are read through ManagedClusterViews (ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "operators-guard.name" . }}-packagemanifests
  namespace: openshift-marketplace
  labels:
    {{- include "operators-guard.labels" . | nindent 4 }}
rules:
- apiGroups: ["packages.operators.coreos.com"]
  resources: ["packagemanifests"]
  verbs:     ["list"]
- apiGroups: ["operators.coreos.com"]
  resources: ["catalogsources"]
  verbs:     ["get"]
