## uses following global values => do not set here
# global:
#   apc:
#     proxy:    # egress proxy for access.redhat.com, api.openshift.com and catalog.redhat.com (HTTPS_PROXY, HTTP_PROXY)
#     noProxy:  # NO_PROXY; .svc, .cluster.local and the API service IP are appended (urllib ignores CIDRs)
#     proxyCIDRs: # proxy CIDRs, a NetworkPolicy allows egress to them (platform namespaces deny it by default)
## and their local overrides
# proxy: ~
# noProxy: ~
# proxyCIDRs: ~

# image: <string> - operators-guard container image without a tag, the tag is the chart appVersion (ghcr.io is private: mirror it to a registry the cluster can pull from)
image: ghcr.io/gr8it/operators-guard
# oauthProxyImage: <string> - OpenShift oauth-proxy sidecar in front of the UI Route (only cluster-admins are let through)
oauthProxyImage: registry.redhat.io/openshift4/ose-oauth-proxy:v4.12.0
# imagePullSecrets: <list> - names of existing kubernetes.io/dockerconfigjson Secrets used to pull the image
imagePullSecrets: []
# nodeSelector: <object> - optional pod nodeSelector (e.g. to pin the pod to a node that already holds the image)
nodeSelector: {}
# interval: <duration> - how often the collector gathers inventory, graph, catalogs and Lifecycle API data
interval: 1h

resources:
  requests:
    memory: 256Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 500m
# historyKeep: <integer> - local report copies retained in the cache (0 disables; emptyDir is lost on pod restart)
historyKeep: 24

# policy: <object> - mandatory, readiness policy rendered as-is into ConfigMap (see https://github.com/gr8it/apc-operators-guard/blob/main/docs/02-design.md, "Policy")
#   strategy (required) eus | next-minor | pinned
#   lockstep, graph.conditionalRisks, unsupportedWindow.allow, exceptions, lifecycleProducts, catalogSources,
#   helmOperators are used by the engine
#   minVersions (package -> minimum installed version), drift.maxDaysBehind / drift.supportWarnDays
#   owners (package -> owner) and defaultOwner (default: unassigned) label operator and drift results
#   (see https://github.com/gr8it/apc-operators-guard/blob/main/engine/README.md); other keys are passed unchanged
policy: {}

snapshot:
  # repository: <string> - optional, OCI repository in hub Quay where the snapshot is pushed (consumed by conf repo CI);
  #   without it nothing is pushed and the snapshot stays in the pod cache
  repository: ~
  # pushSecret: <string> - mandatory when repository is set, existing kubernetes.io/dockerconfigjson Secret with Quay robot push credentials
  pushSecret: ~

brief:
  # enabled: <bool> - write brief.md and pins.yaml to /var/cache/readiness/brief after collection
  enabled: false

grafanaDashboard:
  # enabled: <bool> - creates GrafanaDashboard CR for grafana-operator
  enabled: true
  # instanceName: <string> - value of the `dashboards` label on the Grafana instance
  instanceName: apc-grafana
