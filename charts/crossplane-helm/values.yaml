## uses following global values => do not set here
# global:
#   apc:
#     proxyCIDRs: []
## and their local overrides
# proxyCIDRs: [] # if set, communication to these IP will be allowed

crossplane:
  replicas: 2
  rbacManager:
    replicas: 2
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: crossplane-rbac-manager
  metrics:
    enabled: true
    port: 9090
  securityContextCrossplane:
    runAsUser:
    runAsGroup:
  securityContextRBACManager:
    runAsUser:
    runAsGroup:
  resourcesCrossplane:
    limits:
      cpu: 250m
      memory: 1280Mi
    requests:
      cpu: 50m
      memory: 512Mi
  resourcesRBACManager:
    limits:
      cpu: 100m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: crossplane
  # extraEnvVarsCrossplane:
  #   HTTP_PROXY: ~
  #   HTTPS_PROXY: ~
  #   NO_PROXY: ~

monitoring-reminder:
  reminders:
    CrossplaneVaultTokenExpirySoon:
      summary: Vault token used by Crossplane vault provider expires soon
      description: >
        Static Vault token used by the Crossplane vault provider (secret vault-hub-token in the
        crossplane namespace) expires soon. The provider does not renew the token itself. After
        expiry all Vault managed resources stop reconciling with 403 on auth/token/lookup-self.
        Renew the token (vault token renew) or issue a new periodic one and update the secret,
        then update datetime of this reminder.
      datetime: "04.11.2026 07:04" # UTC!
      daysBeforeExpiry: 7 # token period is 32 days, the default 30 would fire right after renewal
      critical: true
