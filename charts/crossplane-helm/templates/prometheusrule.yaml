apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "crossplane-helm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crossplane-helm.labels" . | nindent 4 }}
spec:
  groups:
  - name: crossplane.rules
    rules:
    - alert: CrossplaneControllerDown
      annotations:
        description: "Crossplane controller pod has been down for more than 10 minutes"
        summary: "Crossplane controller is not running"
      expr: |
        absent(up{job="{{ .Release.Namespace }}/{{ include "crossplane-helm.fullname" . }}"}) == 1
      for: 10m
      labels:
        severity: warning
        vendor: aspecta
        team: platform
    - alert: CrossplaneReconciliationErrors
      annotations:
        description: "Crossplane controller has reconciliation errors for controller {{ `{{ $labels.controller }}` }}"
        summary: "Crossplane reconciliation errors detected"
      expr: |
        increase(controller_runtime_reconcile_errors_total{job="{{ .Release.Namespace }}/{{ include "crossplane-helm.fullname" . }}"}[15m]) > 0
      for: 10m
      labels:
        severity: warning
        vendor: aspecta
        team: platform
    - alert: CrossplaneRBACManagerDown
      annotations:
        description: "Crossplane RBAC manager pod has been down for more than 10 minutes"
        summary: "Crossplane RBAC manager is not running"
      expr: |
        absent(up{job="{{ .Release.Namespace }}/{{ include "crossplane-helm.fullname" . }}-rbac-manager"}) == 1
      for: 10m
      labels:
        severity: warning
        vendor: aspecta
        team: platform
    - alert: CrossplaneProviderDown
      annotations:
        description: "Crossplane provider deployment {{ `{{ $labels.deployment }}` }} has no available replicas for more than 10 minutes"
        summary: "Crossplane provider is not running"
      expr: |
        kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}", deployment=~".+-provider-.+"} == 0
      for: 10m
      labels:
        severity: warning
        vendor: aspecta
        team: platform
    - alert: CrossplaneManagedResourcesNotSynced
      annotations:
        description: "{{ `{{ $value }}` }} managed resources of {{ `{{ $labels.gvk }}` }} are not synced for more than 30 minutes. Check status.conditions of the resources and the provider credentials (ProviderConfig)."
        summary: "Crossplane managed resources are not synced"
      expr: |
        max by (gvk) (crossplane_managed_resource_exists{job="{{ .Release.Namespace }}/{{ include "crossplane-helm.fullname" . }}-providers"})
          - max by (gvk) (crossplane_managed_resource_synced{job="{{ .Release.Namespace }}/{{ include "crossplane-helm.fullname" . }}-providers"}) > 0
      for: 30m
      labels:
        severity: warning
        vendor: aspecta
        team: platform
