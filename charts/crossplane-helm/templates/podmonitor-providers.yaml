apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "crossplane-helm.fullname" . }}-providers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crossplane-helm.labels" . | nindent 4 }}
spec:
  selector:
    matchExpressions:
      - key: pkg.crossplane.io/provider
        operator: Exists
  podMetricsEndpoints:
    - port: metrics
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: crossplane_managed_resource_(exists|synced)
          action: keep
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
