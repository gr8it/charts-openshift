apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: app-project-limitrange
  labels:
  {{- include "kyverno-app-project.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Create default limit range for namespace
    policies.kyverno.io/category: limit range
    policies.kyverno.io/subject: project
    policies.kyverno.io/minversion: 1.20.0
spec:
  evaluation:
    generateExisting:
      enabled: true
    skipBackgroundRequests: {{ .Values.defaultLimitRange.skipBackgroundRequests }}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
    objectSelector:
      matchLabels:
        apc.namespace.type: application
  matchConditions:
    # create only: generateExisting re-applies periodically and would overwrite manual changes
    - name: limitrange-missing
      expression: dyn(resource.Get("v1", "limitranges", object.metadata.name, "default-limit-range")) == null
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: LimitRange
          metadata:
            name: default-limit-range
            namespace: (( object.metadata.name ))
          spec:
            limits:
            {{- with .Values.defaultLimitRange }}
              - default:
                  cpu: {{ .limitsDefaultCpu | quote }}                              # Default CPU limit for containers
                  memory: {{ .limitsDefaultMemory | quote }}                        # Default memory limit for containers
                  ephemeral-storage: {{ .limitsDefaultEphemeralStorage | quote }}   # Default ephemeral storage limit for containers
                defaultRequest:
                  cpu: {{ .limitsDefaultRequestCpu | quote }}                       # Default CPU request for containers
                  memory: {{ .limitsDefaultRequestMemory | quote }}                 # Default memory request for containers
                type: Container
            {{- end }}
