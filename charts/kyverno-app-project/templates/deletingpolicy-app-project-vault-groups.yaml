apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: app-project-vault-groups-cleanup
  annotations:
    policies.kyverno.io/title: Cleanup vault project groups and policies
    policies.kyverno.io/category: Secrets
    policies.kyverno.io/subject: project
    policies.kyverno.io/minversion: 1.20.0
  labels:
    {{- include "kyverno-app-project.labels" . | nindent 4 }}
spec:
  schedule: "0 */3 * * *"
  matchConstraints:
    resourceRules:
      - apiGroups: ["vault.vault.upbound.io"]
        apiVersions: ["*"]
        resources: ["policies"]
      - apiGroups: ["ldap.vault.upbound.io"]
        apiVersions: ["*"]
        resources: ["authbackendgroups"]
    objectSelector:
      matchExpressions:
        - key: generate.kyverno.io/policy-name
          operator: In
          values:
            {{- include "kyverno-app-project.vaultGroupsPolicyNames" . | nindent 12 }}
  variables:
    # resource name is apc-<cluster initial>-<namespace>-<role short name>
    - name: nameParts
      expression: object.metadata.name.split('-')
    - name: namespace
      expression: variables.nameParts.slice(2, size(variables.nameParts) - 1).join('-')
    - name: appNamespaces
      expression: >-
        dyn(resource.List("v1", "namespaces", "", {"apc.namespace.type": "application"}).items).map(n, n.metadata.name)
  conditions:
    - name: namespace-not-an-application-namespace
      expression: "!(variables.namespace in variables.appNamespaces)"
