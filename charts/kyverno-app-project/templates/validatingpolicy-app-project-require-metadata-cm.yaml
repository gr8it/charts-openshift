apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: app-project-require-metadata-configmap
  labels:
    {{- include "kyverno-app-project.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Report application Namespaces without a project metadata ConfigMap
    policies.kyverno.io/category: Monitoring
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/minversion: 1.20.0
spec:
  validationActions:
    - Audit
  evaluation:
    admission:
      enabled: false
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
    objectSelector:
      matchLabels:
        apc.namespace.type: application
  validations:
    - expression: dyn(resource.Get("v1", "configmaps", object.metadata.name, {{ .Values.projectMetadataConfigMapName | quote }})) != null
      messageExpression: >-
        "Namespace '" + object.metadata.name + "' has no
        '{{ .Values.projectMetadataConfigMapName }}' ConfigMap, so the project has no owner and its
        metrics are still reported under the platform defaults. Create the
        ConfigMap in the namespace with proper labels."
