suite: Snapshot test
templates:
  - templates/*
values:
  - ../values.example.yaml
release:
  name: kyverno-app-project

tests:
  - it: manifests should match snapshot
    asserts:
      - matchSnapshot: {}

  - it: copies every key of the project metadata ConfigMap onto the namespace
    template: templates/clusterpolicy-app-project-metadata.yaml
    asserts:
      - equal:
          path: spec.rules[0].match.any[0].resources.names[0]
          value: project-metadata
      - equal:
          path: spec.rules[0].mutate.targets[0].kind
          value: Namespace
      - equal:
          path: spec.rules[0].mutate.patchStrategicMerge.metadata.labels
          value: "{{ object_from_lists(labelentries[].key, labelentries[].value) }}"
      - equal:
          path: spec.rules[0].context[0].variable.jmesPath
          value: "items(request.object.data, 'key', 'value')[?regex_match('^[a-zA-Z0-9]([-_.a-zA-Z0-9]{0,61}[a-zA-Z0-9])?$', key) && regex_match('^[a-zA-Z0-9]([-_.a-zA-Z0-9]{0,61}[a-zA-Z0-9])?$', value) && !starts_with(key, 'apc.') && !contains(key, 'kubernetes') && !contains(key, 'openshift') && !contains(key, 'k8s')]"
      - matchRegex:
          path: spec.rules[0].context[0].variable.jmesPath
          pattern: "!starts_with\\(key, 'apc\\.'\\)"
      - matchRegex:
          path: spec.rules[0].context[0].variable.jmesPath
          pattern: "regex_match\\('\\^\\[a-zA-Z0-9\\]\\(\\[-_\\.a-zA-Z0-9\\]\\{0,61\\}\\[a-zA-Z0-9\\]\\)\\?\\$', key\\)"
      - equal:
          path: spec.rules[0].context[0].variable.default
          value: []
      - equal:
          path: spec.rules[0].preconditions.all[0].key
          value: "{{ length(labelentries) }}"

  - it: only reports, never blocks, a namespace without the project metadata ConfigMap
    template: templates/clusterpolicy-app-project-require-metadata-cm.yaml
    asserts:
      - equal:
          path: spec.rules[0].validate.failureAction
          value: Audit
      - equal:
          path: spec.rules[0].context[0].apiCall.urlPath
          value: "/api/v1/namespaces/{{ request.object.metadata.name }}/configmaps/project-metadata"
      - equal:
          path: spec.rules[0].context[0].apiCall.default
          value: ""
      - equal:
          path: spec.rules[0].validate.deny.conditions.all[0].value
          value: ""

  - it: mirrors the namespace ownership onto services under its own prefix
    template: templates/clusterpolicy-app-project-metadata.yaml
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 3
      - equal:
          path: spec.rules[1].name
          value: mirror-on-service
      # the plain team / vendor labels are never touched, so a service that
      # carries its own keeps it - that is how one namespace can hold more teams
      - equal:
          path: spec.rules[1].mutate.patchStrategicMerge.metadata.labels
          value:
            apc.namespace.team: "{{ nslabels.team }}"
            apc.namespace.vendor: "{{ nslabels.vendor }}"
      # a changed namespace label is pushed into the services that already exist
      - equal:
          path: spec.rules[2].mutate.targets[0].kind
          value: Service
      - equal:
          path: spec.rules[2].mutate.mutateExistingOnPolicyUpdate
          value: true
