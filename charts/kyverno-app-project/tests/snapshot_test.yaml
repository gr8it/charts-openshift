suite: Snapshot test
templates:
  - templates/*
values:
  - ../values.example.yaml
release:
  name: kyverno-app-project

tests:
  - it: manifests should match snapshot
    asserts:
      - matchSnapshot: {}

  - it: copies every valid key of the project metadata ConfigMap onto the namespace
    template: templates/mutatingpolicy-app-project-namespace-metadata.yaml
    asserts:
      - equal:
          path: spec.matchConstraints.resourceRules[0].resourceNames[0]
          value: project-metadata
      - equal:
          path: spec.evaluation.mutateExisting.enabled
          value: true
      - equal:
          path: spec.targetMatchConstraints.expression
          value: resource.Get("v1", "namespaces", "", object.metadata.namespace)
      - matchRegex:
          path: spec.variables[0].expression
          pattern: "k\\.matches\\('\\^\\[a-zA-Z0-9\\]\\(\\[-_\\.a-zA-Z0-9\\]\\{0,61\\}\\[a-zA-Z0-9\\]\\)\\?\\$'\\)"
      - matchRegex:
          path: spec.variables[0].expression
          pattern: "!k\\.startsWith\\('apc\\.'\\)"
      - equal:
          path: spec.matchConditions[0].expression
          value: size(variables.labelKeys) > 0
      - matchRegex:
          path: spec.mutations[0].applyConfiguration.expression
          pattern: "labels: variables.labels"

  - it: only reports, never blocks, a namespace without the project metadata ConfigMap
    template: templates/validatingpolicy-app-project-require-metadata-cm.yaml
    asserts:
      - equal:
          path: spec.validationActions
          value: [Audit]
      - equal:
          path: spec.evaluation.admission.enabled
          value: false
      - equal:
          path: spec.evaluation.background.enabled
          value: true
      - equal:
          path: spec.validations[0].expression
          value: dyn(resource.Get("v1", "configmaps", object.metadata.name, "project-metadata")) != null

  - it: mirrors the namespace ownership onto services without overwriting their own labels
    template: templates/mutatingpolicy-app-project-service-metadata.yaml
    asserts:
      - equal:
          path: spec.variables[0].expression
          value: namespaceObject.metadata.?labels[?'team'].orValue('')
      # a label is added only when missing, so a service that carries its
      # own keeps it - that is how one namespace can hold more teams
      - matchRegex:
          path: spec.mutations[0].applyConfiguration.expression
          pattern: "^'team' in object.metadata.\\?labels.orValue\\(\\{\\}\\) \\? Object\\{\\} :"
      - matchRegex:
          path: spec.mutations[1].applyConfiguration.expression
          pattern: "^'vendor' in object.metadata.\\?labels.orValue\\(\\{\\}\\) \\? Object\\{\\} :"

  - it: pushes the namespace ownership into existing services that miss it
    template: templates/mutatingpolicy-app-project-service-metadata-existing.yaml
    asserts:
      - equal:
          path: spec.evaluation.mutateExisting.enabled
          value: true
      - equal:
          path: spec.targetMatchConstraints.expression
          value: resource.List("v1", "services", object.metadata.name)
      - equal:
          path: spec.variables[0].expression
          value: request.object.metadata.?labels[?'team'].orValue('')

  - it: creates quotas only when missing, so manual changes are kept
    template: templates/generatingpolicy-app-project-default-resource-quota.yaml
    asserts:
      - equal:
          path: spec.matchConditions[0].expression
          value: dyn(resource.Get("v1", "resourcequotas", object.metadata.name, "default-resource-quota")) == null
      - notExists:
          path: spec.evaluation.synchronize

  - it: keeps skipBackgroundRequests configurable per quota
    template: templates/generatingpolicy-app-project-kubevirt-cr-quota.yaml
    set:
      kubevirtCrQuota.skipBackgroundRequests: false
    asserts:
      - equal:
          path: spec.evaluation.skipBackgroundRequests
          value: false

  - it: creates the limit range only when missing
    template: templates/generatingpolicy-app-project-limitrange.yaml
    asserts:
      - equal:
          path: spec.matchConditions[0].expression
          value: dyn(resource.Get("v1", "limitranges", object.metadata.name, "default-limit-range")) == null

  - it: does not create the proxy ConfigMap policy without a proxy
    template: templates/generatingpolicy-app-project-internetproxy-cm.yaml
    set:
      proxy: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a vault policy and group generating policy per vault role of the environment
    template: templates/generatingpolicy-app-project-vault-groups.yaml
    asserts:
      # prod overrides the roles to admin (pja) and operator (opr)
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.name
          value: app-project-vault-groups-pja-policy
        documentIndex: 0
      - equal:
          path: metadata.name
          value: app-project-vault-groups-pja-group
        documentIndex: 1
      - matchRegex:
          path: spec.matchConditions[0].expression
          pattern: 'dyn\(resource.Get\("vault.vault.upbound.io/v1alpha1", "policies", "", "apc-" \+'
        documentIndex: 0
      - matchRegex:
          path: spec.generate[0].template.value
          pattern: 'capabilities = \["create", "read", "update", "delete", "list", "patch"\]'
        documentIndex: 0

  - it: cleans up vault resources generated by the pre-1.20 policy too
    template: templates/deletingpolicy-app-project-vault-groups.yaml
    asserts:
      - contains:
          path: spec.matchConstraints.objectSelector.matchExpressions[0].values
          content: app-project-vault-groups
      - contains:
          path: spec.matchConstraints.objectSelector.matchExpressions[0].values
          content: app-project-vault-groups-opr-group
