{{- with .Values.additionalNetworks }}
# CNV secondary networks are merged into the cluster Network operator's
# additionalNetworks list (merge-keyed by name) so other owners' entries
# (e.g. the ODF network) are left intact.
apiVersion: operator.openshift.io/v1
kind: Network
metadata:
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  name: cluster
spec:
  additionalNetworks:
    {{- toYaml . | nindent 4 }}
{{- end }}
