additionalNetworks:
  - name: vmlm
    namespace: openshift-cnv
    type: Raw
    rawCNIConfig: |-
      {
        "cniVersion": "0.3.1",
        "name" : "vmlm",
        "type": "macvlan",
        "master": "bond1.4079",
        "mode": "bridge",
        "ipam": {
          "type": "whereabouts",
          "range": "10.14.79.0/25",
          "range_start": "10.14.79.10",
          "range_end": "10.14.79.126"
        }
      }
  - name: vm-br-1026
    namespace: openshift-cnv
    type: Raw
    rawCNIConfig: |-
      {
        "cniVersion": "0.3.1",
        "name": "vm-br-1026",
        "type": "cnv-bridge",
        "bridge": "br-1026",
        "disableContainerInterface": true
      }
