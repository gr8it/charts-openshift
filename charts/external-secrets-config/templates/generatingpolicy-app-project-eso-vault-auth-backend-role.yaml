{{- if eq "true" (include "apc-global-overrides.clusterRunsApps" .) }}
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: app-project-eso-vault-auth-backend-role
  annotations:
    policies.kyverno.io/title: Setup vault kubernetes auth role
    policies.kyverno.io/category: Secrets
    policies.kyverno.io/subject: project
    policies.kyverno.io/minversion: 1.20.0
spec:
  evaluation:
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
    objectSelector:
      matchLabels:
        apc.namespace.type: application
  matchConditions:
    # create only: re-applying causes a reconciliation loop with crossplane
    - name: auth-backend-role-missing
      expression: dyn(resource.Get("kubernetes.vault.upbound.io/v1alpha1", "authbackendroles", "", object.metadata.name + "-vie")) == null
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: kubernetes.vault.upbound.io/v1alpha1
          kind: AuthBackendRole
          metadata:
            name: (( object.metadata.name ))-vie
          spec:
            forProvider:
              roleName: (( object.metadata.name ))-vie
              boundServiceAccountNames:
                - vault-auth
              boundServiceAccountNamespaces:
                - (( object.metadata.name ))
              backend: {{ include "apc-global-overrides.require-vaultKubeAuthMountPath" . }}
              tokenTtl: 900
              tokenPolicies:
                - {{ .Values.vaultKVmount }}-{{ include "apc-global-overrides.environmentShort" . }}-svc-vie
            providerConfigRef:
              name: {{ include "apc-global-overrides.require-crossplaneKubeVaultProviderConfigName" . }}
{{- end }}
