# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Use cases
templates:
  - templates/deployment.yaml
  - templates/ingress.yaml
  - templates/serving-certs-ca-bundle-configmap.yaml
  - templates/servicemonitor.yaml
  - templates/serviceaccount.yaml
  - templates/service.yaml
values:
  - ../values.example.yaml
release:
  name: apc-gatling-operator
  namespace: apc-gatling-operator

tests:
  - it: renders the configured ingress
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: example-issuer
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: gatling.example.com
      - equal:
          path: spec.tls[0].secretName
          value: gatling-tls

  - it: does not render ingress when disabled
    template: templates/ingress.yaml
    set:
      ingress.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: applies service account annotations and overrides
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.name
          value: gatling-controller
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: performance-team
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: reuses an existing service account in the deployment
    template: templates/deployment.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: existing-gatling-operator
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-gatling-operator

  - it: does not create a service account when reusing one
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: existing-gatling-operator
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when service account reuse has no name
    template: templates/deployment.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: ""
    asserts:
      - failedTemplate:
          errorMessage: serviceAccount.name is required when serviceAccount.create is false

  - it: applies pod metadata and naming and image overrides
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: gatling-controller
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: controller
      - equal:
          path: spec.template.metadata.labels.team
          value: performance
      - equal:
          path: spec.template.spec.containers[1].image
          value: registry.example.com/platform/gatling-operator:0.9.12
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 50m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 128Mi

  - it: renders ServiceMonitor when enabled
    template: templates/servicemonitor.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: gatling-controller
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.endpoints[0].scheme
          value: https
      - equal:
          path: spec.endpoints[0].port
          value: https
      - equal:
          path: spec.endpoints[0].tlsConfig.serverName
          value: gatling-controller.apc-gatling-operator.svc
      - equal:
          path: spec.endpoints[0].tlsConfig.ca.configMap.name
          value: gatling-controller-serving-certs-ca-bundle

  - it: annotates Service for OpenShift serving cert when enabled
    template: templates/service.yaml
    asserts:
      - equal:
          path: metadata.annotations["service.beta.openshift.io/serving-cert-secret-name"]
          value: gatling-controller-tls
      - equal:
          path: spec.ports[0].name
          value: https
      - equal:
          path: spec.ports[0].targetPort
          value: https

  - it: renders injected CA bundle configmap when OpenShift service-ca is enabled
    template: templates/serving-certs-ca-bundle-configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.annotations["service.beta.openshift.io/inject-cabundle"]
          value: "true"

  - it: does not render ServiceMonitor when disabled
    template: templates/servicemonitor.yaml
    set:
      serviceMonitor.enabled: false
    asserts:
      - hasDocuments:
          count: 0