# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Use cases
templates:
  - templates/deployment.yaml
  - templates/servicemonitor.yaml
  - templates/serviceaccount.yaml
  - templates/service.yaml
values:
  - ../values.example.yaml
release:
  name: apc-gatling-operator
  namespace: apc-gatling-operator

tests:
  - it: applies service account annotations and overrides
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.name
          value: gatling-controller
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: performance-team
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: reuses an existing service account in the deployment
    template: templates/deployment.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: existing-gatling-operator
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-gatling-operator

  - it: does not create a service account when reusing one
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: existing-gatling-operator
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when service account reuse has no name
    template: templates/deployment.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: ""
    asserts:
      - failedTemplate:
          errorMessage: serviceAccount.name is required when serviceAccount.create is false

  - it: applies pod metadata and naming and image overrides
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: gatling-controller
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: controller
      - equal:
          path: spec.template.metadata.labels.team
          value: performance
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/platform/gatling-operator:0.9.12
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: metrics

  - it: renders ServiceMonitor when enabled
    template: templates/servicemonitor.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: gatling-controller
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.endpoints[0].scheme
          value: http
      - equal:
          path: spec.endpoints[0].port
          value: metrics

  - it: aligns service target port to manager metrics port
    template: templates/service.yaml
    asserts:
      - equal:
          path: spec.ports[0].name
          value: metrics
      - equal:
          path: spec.ports[0].targetPort
          value: metrics

  - it: does not render ServiceMonitor when disabled
    template: templates/servicemonitor.yaml
    set:
      serviceMonitor.enabled: false
    asserts:
      - hasDocuments:
          count: 0