image:
  repository: registry.example.com/platform/gatling-operator
  tag: "0.9.12"

nameOverride: gatling-controller
fullnameOverride: gatling-controller

serviceAccount:
  create: true
  automount: true
  annotations:
    example.com/owner: performance-team
  name: gatling-controller

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8443"

podLabels:
  app.kubernetes.io/component: controller
  team: performance

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  scheme: https
  port: https
  additionalLabels: {}
  tlsConfig:
    insecureSkipVerify: false
    serverName: ""
  openshift:
    serviceCA:
      enabled: true
      servingCertSecretName: ""
      caBundleConfigMapName: ""
      caBundleConfigMapKey: service-ca.crt


ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: example-issuer
  hosts:
    - host: gatling.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gatling-tls
      hosts:
        - gatling.example.com

