apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gatling-operator.fullname" . }}-project-admin
  labels:
    rbac.authorization.k8s.io/aggregate-to-apc-project-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-apc-project-developer: "true"
    rbac.authorization.k8s.io/aggregate-to-apc-project-operator: "true"
    rbac.authorization.k8s.io/aggregate-to-apc-project-tester: "true"
rules:
- apiGroups:
  - gatling-operator.tech.zozo.com
  resources:
  - gatlings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gatling-operator.tech.zozo.com
  resources:
  - gatlings/finalizers
  verbs:
  - update
- apiGroups:
  - gatling-operator.tech.zozo.com
  resources:
  - gatlings/status
  verbs:
  - get
  - patch
  - update