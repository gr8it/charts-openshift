apiVersion: v1
kind: Service
metadata:
  name: {{ include "gatling-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gatling-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "gatling-operator.selectorLabels" . | nindent 4 }}
