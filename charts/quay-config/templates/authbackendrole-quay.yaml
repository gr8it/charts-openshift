{{- if (include "apc-global-overrides.require-vaultKubeAuthMountPath" .) }}
---
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: {{ printf "%s-%s" (include "apc-global-overrides.require-clusterName" .) .Release.Namespace }}
  labels:
    {{- include "quay-config.labels" . | nindent 4 }}
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: {{ include "apc-global-overrides.require-crossplaneKubeVaultProviderConfigName" . }}
  forProvider:
    backend: {{ include "apc-global-overrides.require-vaultKubeAuthMountPath" . }}
    boundServiceAccountNames: ["{{ include "quay-config.objname.sa" . }}"]
    boundServiceAccountNamespaces: ["{{ .Release.Namespace }}"]
    roleName: {{ .Release.Namespace }}
    tokenPolicies:
      - default
      - {{ include "quay-config.objname.vault-policy" . }}
    tokenTtl: 900
{{- end }}
