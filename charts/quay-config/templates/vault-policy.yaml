{{- if or .Values.vault.refPullSecretPath (values (.Values.vault.clusterPullSecretPath | default dict) | compact) }}
---
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: {{ include "quay-config.objname.vault-policy" . }}
  labels:
    {{- include "quay-config.labels" . | nindent 4 }}
spec:
  deletionPolicy: Delete
  forProvider:
    name: {{ include "quay-config.objname.vault-policy" . }}
    policy: |2

      {{- $clusterPullSecretPath := default dict .Values.vault.clusterPullSecretPath }}

      {{- if and .Values.vault.refPullSecretPath (not (has .Values.vault.refPullSecretPath (values $clusterPullSecretPath))) }}
      {{- $refPullSecretPath := .Values.vault.refPullSecretPath }}
      path "{{ $refPullSecretPath }}" {
        capabilities = ["read", "list"]
      }
      path "{{ include "quay-config.insertPathSegment" (dict "path" $refPullSecretPath "insert" "data") }}" {
        capabilities = ["read", "list"]
      }
      path "{{ include "quay-config.insertPathSegment" (dict "path" $refPullSecretPath "insert" "metadata") }}" {
        capabilities = ["read", "list"]
      }
      {{- end }}

      {{- range $cluster, $path := $clusterPullSecretPath }}
      {{- if $path }}
      path "{{ $path }}" {
        capabilities = ["create", "read", "update", "patch", "list"]
      }
      path "{{ include "quay-config.insertPathSegment" (dict "path" $path "insert" "data") }}" {
        capabilities = ["create", "read", "update", "patch", "list"]
      }
      path "{{ include "quay-config.insertPathSegment" (dict "path" $path "insert" "metadata") }}" {
        capabilities = ["create", "read", "update", "patch", "list"]
      }
      {{- end }}
      {{- end }}
  initProvider: {}
  managementPolicies:
  - '*'
  providerConfigRef:
    name: {{ include "apc-global-overrides.require-crossplaneKubeVaultProviderConfigName" . }}
{{- end }}
