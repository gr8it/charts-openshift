{{- if and .Values.argocd.syncOnPullSecretUpdate .Values.vault.refPullSecretPath }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
  name: {{ printf "kyverno:background-controller:%s:%s" .Release.Namespace (include "quay-config.name" .) }}
rules:
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "update", "patch"]
  resourceNames: ["{{ .Values.argocd.appName | default .Chart.Name }}"]
{{- end }}
