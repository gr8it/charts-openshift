{{- if or .Values.vault.refPullSecretPath (values (.Values.vault.clusterPullSecretPath | default dict) | compact) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-auth-delegator" (include "quay-config.name" .) .Release.Namespace }}
  labels:
    {{- include "quay-config.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: {{ include "quay-config.objname.sa" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
