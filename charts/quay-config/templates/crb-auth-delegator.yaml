---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "quay-config.name" . }}-auth-delegator
  labels:
    {{- include "quay-config.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: {{ include "quay-config.objname.sa" . }}
  namespace: {{ .Release.Namespace }}
