---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quay-config.objname.postinst-scripts" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quay-config.labels" . | nindent 4 }}
  #annotations:
  #  argocd.argoproj.io/hook: Sync
  #  argocd.argoproj.io/sync-wave: "10"
data:
  {{- range $path, $_ := .Files.Glob "files/*.sh" }}
  {{ $path | base }}: |2
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
