---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quay-config.name" . }}-postinstall-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quay-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "10"
data:
  common-functions.sh: |2
    {{- $.Files.Get "files/common-functions.sh" | nindent 4 }}
  init-admin.sh: |2
    {{- $.Files.Get "files/init-admin.sh" | nindent 4 }}
