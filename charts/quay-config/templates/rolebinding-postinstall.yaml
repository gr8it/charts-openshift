---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quay-config.name" . }}-postinstall
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quay-config.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "quay-config.name" . }}-postinstall
subjects:
  - kind: ServiceAccount
    name: {{ include "quay-config.name" . }}-postinstall
    namespace: {{ .Release.Namespace }}
