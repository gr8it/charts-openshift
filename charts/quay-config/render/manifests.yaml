---
# Source: quay-config/templates/configmap-postinstall-scripts.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: apc-registry-postinstall-scripts
  namespace: quay-test
  labels:
    helm.sh/chart: quay-config-0.1.0
    app.kubernetes.io/name: apc-registry
    app.kubernetes.io/instance: apc-quay
    app.kubernetes.io/managed-by: Helm
  #annotations:
  #  argocd.argoproj.io/hook: Sync
  #  argocd.argoproj.io/sync-wave: "10"
data:
  common-functions.sh: |2
    #!/usr/bin/env bash
    
    log_phase() {
      printf '\n[>>>] %s\n' "$*"
    }
    
    log_info() {
      printf '[inf] %s\n' "$*"
    }
    
    log_error() {
      printf '[err] %s\n' "$*"
    }
    
    get_http_code() {
      curl --insecure --connect-timeout 3 \
        --silent --output /dev/null \
        --write-out '%{http_code}'  \
        "$1"
    }
    
    get_http_code_auth () {
      curl --insecure --connect-timeout 5 \
        --silent --output /dev/null \
        --write-out '%{http_code}' \
        --header "Authorization: Bearer $1" \
        "$2"
    }
    
    has_json_key() {
      printf '%s' "$1" | python3 -c "import json,sys; sys.exit(0 if sys.argv[1] in json.load(sys.stdin) else 1)" "$2" 2>/dev/null
    }
    
    get_json_value() {
      printf '%s' "$1" | python3 -c "
    import json,sys;
    value=json.load(sys.stdin).get(sys.argv[1])
    if isinstance(value, (dict, list)):
      print(json.dumps(value))
    elif value is not None:
      print(value)
    " "$2"
    }
    
    urlencode() {
      printf '%s' "$*" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=''), end='')"
    }
    
    validate_pull_secret() {
      printf '%s' "$*" | python3 -c "
    import json,sys,base64
    try:
        data = json.load(sys.stdin)
        if 'auths' not in data: raise ValueError('Missing auths key')
        for reg, body in data['auths'].items():
            if 'auth' not in body: raise ValueError(f'Missing auth token for {reg}')
            base64.b64decode(body['auth']).decode('utf-8').split(':', 1)
        sys.exit(0)
    except Exception as e:
        print(f'Invalid config: {e}', file=sys.stderr)
        sys.exit(1)
    "
    }
    
  init-admin.sh: |2
    #!/usr/bin/env bash
    set -e -u -o pipefail
    
    #-- import common functions -------------------------------
    SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    source "$SCRIPT_DIR/common-functions.sh"
    
    #-- functions ---------------------------------------------
    admin_credentials() {
      printf '{ "username": "%s", "password": "%s", "mail": "%s@localhost", "access_token": false }' "$1" "$2" "$1"
    }
    
    #-- variables ---------------------------------------------
    adminPassword="$(openssl rand -base64 32 | tr -d /=+ | cut -c1-20)"
    adminUser="$QUAYADMINUSER"
    namespace="$NAMESPACE"
    quayName="$QUAYNAME"
    secretName="$QUAYADMINSECRET"
    pushSecretLabels="$LABELS" #"$PUSHSECRETLABELS"
    quayService="$QUAYSERVICE"
    
    #-- main --------------------------------------------------
    log_phase "Setting up local admin user ..."
    adminInitCredentials=$(admin_credentials "$adminUser" "$adminPassword")
    adminInitResponse=$(curl --silent --show-error --connect-timeout 10 \
      --request POST --write-out "\n%{http_code}" \
      --header "Content-Type: application/json" \
      --data "$adminInitCredentials" \
      "${quayService}/api/v1/user/initialize")
    adminInitCode=$(echo "$adminInitResponse" | tail -n1)
    adminInitMsg=$(echo "$adminInitResponse" | sed '$d')
    case "$adminInitCode" in
      200)
        log_info "Admin user created successfully"
        ;;
      400)
        log_info "Admin user is already initialized. Nothing to do."
        if oc get secret "$secretName"  >/dev/null 2>&1; then
          exit 0
        else
          log_error "Admin user is initialized but the secret $secretName does not exist."
          exit 1
        fi
        ;;
      *)
        log_error "Something went wrong during admin user creation."
        echo "$adminInitMsg"
        exit 1
        ;;
    esac
    
    log_phase "Storing admin credentials in a secret ..."
    quayUuid=$(oc get QuayRegistry "$quayName" -o jsonpath='{.metadata.uid}')
    oc apply -f - <<EOT > /dev/null
    apiVersion: v1
    kind: Secret
    metadata:
      name: "$secretName"
      namespace: "$namespace"
      labels:
        ${pushSecretLabels}
      ownerReferences:
        - apiVersion: quay.redhat.com/v1
          kind: QuayRegistry
          name: "$quayName"
          uid: "$quayUuid"
    type: Opaque
    stringData:
      username: "$adminUser"
      password: "$adminPassword"
    EOT
    log_info "Admin credentials stored in secret/${secretName}"
    
    exit 0
    
  init-bootstrap-token.sh: |2
    #!/usr/bin/env bash
    set -e -u -o pipefail
    
    #-- import common functions -------------------------------
    SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    source "$SCRIPT_DIR/common-functions.sh"
    
    #-- variables ---------------------------------------------
    waitCounter=0
    waitRetries=20
    tokenExists=0
    sleepCycleSeconds=30
    bootstrapTokenSecret="$BOOTSTRAPTOKENSECRET"
    quayService="$QUAYSERVICE"
    
    #-- main --------------------------------------------------
    log_phase "Checking if bootstrap token secret exists ..."
    until [ "$tokenExists" -eq 1 ]; do
      waitCounter=$((waitCounter+1))
      if [ $waitCounter -gt $waitRetries ]; then
        log_error "Giving up. Bootstrap token secret was not provisioned in time."
        exit 1
      fi
      bootstrapTokenJson=$( oc get secret $bootstrapTokenSecret -o go-template='{{ index .data "token.json" | base64decode}}' 2>/dev/null || true )
    
      if has_json_key "${bootstrapTokenJson:-}" "access_token"; then
        bootstrapToken="$(get_json_value "${bootstrapTokenJson:-}" "access_token")"
      fi
    
      if  [ "${bootstrapToken:-}" != "" ] &&
          [ "${bootstrapToken:-}" != "None" ]; then
        tokenExists=1
        continue
      fi
    
      log_info "[${waitCounter}/${waitRetries}] Bootstrap token is not ready yet. Sleeping for $sleepCycleSeconds seconds."
      sleep "$sleepCycleSeconds"
    done
    log_info "Bootstrap token secret exists."
    
    log_phase "Checking if bootstrap token is valid ..."
    checkTokenResponse=$(get_http_code_auth "$bootstrapToken" "${quayService}/api/v1/user/")
    checkTokenCode=$(echo "$checkTokenResponse" | tail -n1)
    checkTokenMsg=$(echo "$checkTokenResponse" | sed '$d')
    
    if [ "$checkTokenCode" -eq 401 ]; then
      tokenRotated=0
      log_info "Bootstrap token is expired and will be rotated."
      quayAppPod=$( oc get pods -l quay-component=quay-app --field-selector status.phase=Running -o jsonpath='{.items[0].metadata.name}' )
      renewReply=$(oc exec $quayAppPod -- curl -sS -X POST -H "Authorization: Bearer $bootstrapToken" "http://127.0.0.1:8080/api/v1/bootstrap/renew")
      if [ "$renewReply" != '{"status": "rotated"}' ]; then
        log_error "There was a problem with renewing the bootstrap token:"
        echo "$renewReply"
        exit 1
      fi
      while [ "${newBootstrapToken:-$bootstrapToken}" = "$bootstrapToken"  ]; do
        if [ $tokenRotated -ge $((waitRetries/2)) ]; then
          log_error "Giving up. New bootstrap token was not provisioned in time."
          exit 1
        fi
        bootstrapTokenJson=$( oc get secret $bootstrapTokenSecret -o go-template='{{ index .data "token.json" | base64decode}}' 2>/dev/null || true )
        newBootstrapToken="$(get_json_value "${bootstrapTokenJson:-}" "access_token")"
        tokenRotated=$((tokenRotated+1))
        log_info "[${tokenRotated}/$((waitRetries/2))] Waiting for new token secret to be provisioned."
        sleep 5
      done
      bootstrapToken="$newBootstrapToken"
      log_info "Bootstrap token has been rotated."
    fi
    
    if [ "${tokenRotated:-0}" -gt 0 ]; then
      log_phase "Checking if new (rotated) bootstrap token is valid ..."
      checkTokenResponse=$(get_http_code_auth "$bootstrapToken" "${quayService}/api/v1/user/")
      checkTokenCode=$(echo "$checkTokenResponse" | tail -n1)
      checkTokenMsg=$(echo "$checkTokenResponse" | sed '$d')
    fi
    
    if [ "$checkTokenCode" -ne 200 ]; then
      log_error "Bootstrap bearer token is invalid. Unable to proceed (http_code: $checkTokenCode)."
      echo "$checkTokenMsg"
      exit 1
    fi
    
    echo "$bootstrapToken" > /var/opt/token/bootstrap
    
    log_info "Bootstrap token is valid."
    
    exit 0
    
  init-manged-registries-cm.sh: |2
    #!/usr/bin/env bash
    set -e -u -o pipefail
    
    #-- import common functions -------------------------------
    SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    source "$SCRIPT_DIR/common-functions.sh"
    
    #-- variables ---------------------------------------------
    quayName="$QUAYNAME"
    managedRegistriesCm="$MANAGEDORGCM"
    namespace="$NAMESPACE"
    cmLabels="$LABELS"
    
    #-- main (init cm) ----------------------------------------
    log_phase "Creating $managedRegistriesCm ConfigMap ..."
    if oc get configmap "$managedRegistriesCm" >/dev/null 2>&1; then
      log_info "ConfigMap $managedRegistriesCm already exists. Nothing to do."
      exit 0
    fi
    
    quayUuid=$(oc get QuayRegistry "$quayName" -o jsonpath='{.metadata.uid}')
    oc apply -f - <<EOT > /dev/null
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: "$managedRegistriesCm"
      namespace: "$namespace"
      labels:
        ${cmLabels}
      ownerReferences:
        - apiVersion: quay.redhat.com/v1
          kind: QuayRegistry
