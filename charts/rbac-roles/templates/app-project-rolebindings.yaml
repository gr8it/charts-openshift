{{- if .Values.createClusterPolicy }}
{{- $roles := (include "rbac-roles.roles" . | fromYaml) }}
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: app-project-roles
  annotations:
    policies.kyverno.io/title: Create project roles bindings
    policies.kyverno.io/category: rolebindings
    policies.kyverno.io/subject: project
    policies.kyverno.io/minversion: 1.20.0
  labels:
  {{- include "rbac-roles.labels" $ | nindent 4 }}
spec:
  evaluation:
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
    objectSelector:
      matchLabels:
        apc.namespace.type: application
  generate:
    {{- range $apcRole, $ocpRole := $roles }}
    {{- if ne (len $ocpRole) 0 }}
    {{- $groupSuffix := get $.Values.groupSuffix $apcRole }}
    - template:
        interpolate: cel
        value: |
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: {{ lower $groupSuffix }}-{{ $apcRole }}-binding
            namespace: (( object.metadata.name ))
          subjects:
            - kind: Group
              name: APC-{{ upper (include "apc-global-overrides.environmentShort" $) }}-(( object.metadata.name.upperAscii() ))-{{ $groupSuffix }}
              apiGroup: rbac.authorization.k8s.io
          roleRef:
            kind: ClusterRole
            name: {{ $apcRole }}
            apiGroup: rbac.authorization.k8s.io
    {{- end }}
    {{- end }}
{{- end }}
