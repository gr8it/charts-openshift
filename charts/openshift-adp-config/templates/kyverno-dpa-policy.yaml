{{- if and .Values.kyverno.enabled (.Values.kyverno.dpaPolicy.enabled | default false) }}
apiVersion: policies.kyverno.io/v1
kind: NamespacedGeneratingPolicy
metadata:
  name: {{ include "openshift-adp-config.fullname" . }}-generate-dpa
  namespace: {{ .Values.targetNamespace }}
  labels:
    {{- include "openshift-adp-config.labels" . | nindent 4 }}
spec:
  evaluation:
    generateExisting:
      enabled: {{ default true .Values.kyverno.generateExisting }}
    synchronize:
      enabled: {{ default true .Values.kyverno.synchronize }}
    orphanDownstreamOnPolicyDelete:
      enabled: {{ default true .Values.kyverno.orphanDownstreamOnPolicyDelete }}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
        resourceNames: ["openshift-service-ca.crt"]
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: oadp.openshift.io/v1alpha1
          kind: DataProtectionApplication
          metadata:
            name: {{ .Values.dpa.name }}
            namespace: {{ .Values.targetNamespace }}
            labels:
              {{- include "openshift-adp-config.labels" . | nindent 14 }}
          spec:
            {{- include "openshift-adp-config.dpaSpec" (dict "root" . "caCert" "\"(( base64.encode(bytes(object.data['service-ca.crt'])) ))\"") | nindent 12 }}
{{- end }}
