{{- if .Values.kyverno.enabled }}
{{- /* compute names with safe defaults */ -}}
{{- $cluster := include "apc-global-overrides.clusterName" . -}}

{{- $sourceNs := default "apc-backup" .Values.sourceNamespace -}}
{{- $targetNs := default "openshift-adp" .Values.targetNamespace -}}

{{- $backupSourceDefault := printf "oadp-%s-app-backup" $cluster -}}
{{- $backupTargetDefault := printf "oadp-%s-app-backup-cloud-credentials" $cluster -}}
{{- $restoreSourceDefault := printf "oadp-%s-app-restore" $cluster -}}
{{- $restoreTargetDefault := printf "oadp-%s-app-restore-cloud-credentials" $cluster -}}

{{- $backupSourceName := default $backupSourceDefault (default "" .Values.credentials.backup.sourceName) -}}
{{- $backupTargetName := default $backupTargetDefault (default "" .Values.credentials.backup.targetName) -}}
{{- $restoreSourceName := default $restoreSourceDefault (default "" .Values.credentials.restore.sourceName) -}}
{{- $restoreTargetName := default $restoreTargetDefault (default "" .Values.credentials.restore.targetName) -}}

apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: {{ printf "%s-oadp-cloud-credentials" (include "openshift-adp-config.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "openshift-adp-config.labels" . | nindent 4 }}
spec:
  evaluation:
    generateExisting:
      enabled: {{ default true .Values.kyverno.generateExisting }}
    synchronize:
      enabled: {{ default true .Values.kyverno.synchronize }}
    orphanDownstreamOnPolicyDelete:
      enabled: {{ default true .Values.kyverno.orphanDownstreamOnPolicyDelete }}
    skipBackgroundRequests: {{ default false .Values.kyverno.skipBackgroundRequests }}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
        resourceNames: ["{{ $backupSourceName }}", "{{ $restoreSourceName }}"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: "{{ $sourceNs }}"
  variables:
    # backup and restore credentials share the same layout, only the names differ
    - name: targetName
      expression: >-
        object.metadata.name == "{{ $backupSourceName }}" ? "{{ $backupTargetName }}" : "{{ $restoreTargetName }}"
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: (( variables.targetName ))
            namespace: "{{ $targetNs }}"
            labels:
              {{- include "openshift-adp-config.labels" . | nindent 14 }}
              {{- if .Values.dpa.name }}
              dataprotectionapplication.name: "{{ .Values.dpa.name }}"
              {{- end }}
              openshift.io/oadp: "True"
          type: Opaque
          stringData:
            cloud: |
              [default]
              aws_access_key_id: "(( string(base64.decode(object.data.?AWS_ACCESS_KEY_ID.orValue(''))) ))"
              aws_secret_access_key: "(( string(base64.decode(object.data.?AWS_SECRET_ACCESS_KEY.orValue(''))) ))"
{{- end }}
