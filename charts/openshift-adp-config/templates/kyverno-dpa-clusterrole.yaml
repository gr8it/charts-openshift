{{- if and .Values.kyverno.enabled (.Values.kyverno.dpaPolicy.enabled | default false) (.Values.kyverno.dpaPolicy.rbac.create | default true) }}
# Kyverno >= 1.19 watches synchronized downstream resources cluster-wide
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:{{ include "openshift-adp-config.fullname" . }}-dpa-watch
  labels:
    {{- include "openshift-adp-config.labels" . | nindent 4 }}
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["oadp.openshift.io"]
    resources: ["dataprotectionapplications"]
    verbs: ["get", "list", "watch"]
{{- end }}
