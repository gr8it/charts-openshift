# OperatorPolicy Values
acm-operatorpolicy:
  # Fresh clusters need an own-namespace OperatorGroup. Existing clusters may
  # have generated names; check those before applying this policy. The template
  # renders this name and does not select an existing group by namespace.
  operatorGroup:
    name: kubevirt-hyperconverged-group
    namespace: openshift-cnv
    targetNamespaces:
      - openshift-cnv
  subscription:
    channel: stable
    name: kubevirt-hyperconverged
    namespace: openshift-cnv
    source: redhat-operators
    sourceNamespace: openshift-marketplace
    startingCSV: kubevirt-hyperconverged-operator.v4.19.37
  # Managed upgrades: list all CSVs that ACM may auto-approve (currently-installed and upgrade target).
  upgradeApproval: Automatic
  versions:
    - kubevirt-hyperconverged-operator.v4.17.5
