suite: Bucket secret policy
values:
  - ../values.lint.yaml
release:
  name: multi-cluster-observability
  namespace: open-cluster-management-observability

tests:
  - it: renders hardcoded Kyverno annotations for hub clusters
    template: templates/policy-object-bucket-secretinfo.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NamespacedGeneratingPolicy
      - equal:
          path: metadata.name
          value: generate-thanos-object-storage-secret
      - equal:
          path: metadata.namespace
          value: open-cluster-management-observability
      - equal:
          path: metadata.annotations["policies.kyverno.io/title"]
          value: Generate Thanos Object Storage Secret
      - equal:
          path: metadata.annotations["policies.kyverno.io/category"]
          value: ODF
      - equal:
          path: metadata.annotations["policies.kyverno.io/subject"]
          value: Thanos Object Storage
      - equal:
          path: metadata.annotations["policies.kyverno.io/minversion"]
          value: 1.20.0
      - equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value: [objectbucketclaims]
      - equal:
          path: spec.evaluation.synchronize.enabled
          value: true
      - equal:
          path: spec.matchConditions[0].expression
          value: >-
            dyn(resource.Get("v1", "secrets", object.metadata.name)) != null &&
            dyn(resource.Get("v1", "configmaps", object.metadata.name)) != null
      - matchRegex:
          path: spec.generate[0].template.value
          pattern: '\n  name: thanos-object-storage\n  namespace: open-cluster-management-observability\n'
      - matchRegex:
          path: spec.generate[0].template.value
          pattern: |-
            type: Opaque
            stringData:
              thanos.yaml: \|
                type: s3
                config:
                  bucket: \(\( variables.obcConfigMap.data.BUCKET_NAME \)\)
                  endpoint: \(\( variables.obcConfigMap.data.BUCKET_HOST \)\):\(\( variables.obcConfigMap.data.BUCKET_PORT \)\)
                  insecure: false
                  access_key: "\(\( string\(base64.decode\(variables.obcSecret.data.\?AWS_ACCESS_KEY_ID.orValue\(''\)\)\) \)\)"
                  secret_key: "\(\( string\(base64.decode\(variables.obcSecret.data.\?AWS_SECRET_ACCESS_KEY.orValue\(''\)\)\) \)\)"
                  http_config:
                    tls_config:
                      insecure_skip_verify: false
                      ca_file: /etc/ssl/certs/thanos/service-ca.crt

  - it: does not render for non-hub clusters
    template: templates/policy-object-bucket-secretinfo.yaml
    set:
      global.apc.cluster.isHub: false
    asserts:
      - hasDocuments:
          count: 0
