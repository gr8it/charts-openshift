suite: Thanos TLS CA policy
templates:
  - templates/policy-thanos-tls-ca.yaml
values:
  - ../values.lint.yaml
release:
  name: multi-cluster-observability
  namespace: open-cluster-management-observability

tests:
  - it: generates thanos-tls-ca from the service CA ConfigMap on hub clusters
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NamespacedGeneratingPolicy
      - equal:
          path: metadata.name
          value: generate-thanos-tls-ca-secret
      - equal:
          path: metadata.namespace
          value: open-cluster-management-observability
      - equal:
          path: spec.matchConstraints.resourceRules[0].resourceNames[0]
          value: openshift-service-ca.crt
      - equal:
          path: spec.evaluation.synchronize.enabled
          value: true
      - matchRegex:
          path: spec.generate[0].template.value
          pattern: '\n  name: thanos-tls-ca\n  namespace: open-cluster-management-observability\n'
      - matchRegex:
          path: spec.generate[0].template.value
          pattern: "\\n  service-ca.crt: \\(\\( object.data\\['service-ca.crt'\\] \\)\\)\\n"

  - it: does not render for non-hub clusters
    set:
      global.apc.cluster.isHub: false
    asserts:
      - hasDocuments:
          count: 0
