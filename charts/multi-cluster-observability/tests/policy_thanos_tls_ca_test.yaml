suite: Thanos TLS CA policy
templates:
  - templates/policy-thanos-tls-ca.yaml
values:
  - ../values.lint.yaml
release:
  name: multi-cluster-observability
  namespace: open-cluster-management-observability

tests:
  - it: generates thanos-tls-ca from the service CA ConfigMap on hub clusters
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Policy
      - equal:
          path: metadata.name
          value: generate-thanos-tls-ca-secret
      - equal:
          path: metadata.namespace
          value: open-cluster-management-observability
      - equal:
          path: spec.rules[0].match.all[0].resources.names[0]
          value: openshift-service-ca.crt
      - equal:
          path: spec.rules[0].generate.name
          value: thanos-tls-ca
      - equal:
          path: spec.rules[0].generate.namespace
          value: open-cluster-management-observability
      - equal:
          path: spec.rules[0].generate.synchronize
          value: true
      - equal:
          path: spec.rules[0].generate.data.stringData["service-ca.crt"]
          value: '{{ request.object.data."service-ca.crt" }}'

  - it: does not render for non-hub clusters
    set:
      global.apc.cluster.isHub: false
    asserts:
      - hasDocuments:
          count: 0
