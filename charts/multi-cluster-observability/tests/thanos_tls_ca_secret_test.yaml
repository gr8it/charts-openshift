suite: Thanos TLS CA secret template
templates:
  - templates/thanos-tls-ca-secret.yaml
values:
  - ../values.lint.yaml
release:
  name: multi-cluster-observability
  namespace: open-cluster-management-observability

tests:
  - it: renders the CA bundle secret referenced by the MultiClusterObservability CR
    set:
      thanosTlsCa.caBundle: "-----BEGIN CERTIFICATE-----\nAAAA\n-----END CERTIFICATE-----\n"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: thanos-tls-ca
      - equal:
          path: metadata.namespace
          value: open-cluster-management-observability
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data["service-ca.crt"]
          value: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCkFBQUEKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=

  - it: does not render when no CA bundle is set
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render for non-hub clusters
    set:
      global.apc.cluster.isHub: false
      thanosTlsCa.caBundle: "-----BEGIN CERTIFICATE-----\nAAAA\n-----END CERTIFICATE-----\n"
    asserts:
      - hasDocuments:
          count: 0
