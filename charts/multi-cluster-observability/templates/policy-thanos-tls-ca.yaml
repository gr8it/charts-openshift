{{- if eq (include "apc-global-overrides.clusterIsHub" .) "true" }}
apiVersion: policies.kyverno.io/v1
kind: NamespacedGeneratingPolicy
metadata:
  name: generate-thanos-tls-ca-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-cluster-observability.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Generate Thanos TLS CA Secret
    policies.kyverno.io/category: ODF
    policies.kyverno.io/subject: Thanos Object Storage
    policies.kyverno.io/minversion: 1.20.0
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
    orphanDownstreamOnPolicyDelete:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
        resourceNames: ["openshift-service-ca.crt"]
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: thanos-tls-ca
            namespace: {{ .Release.Namespace }}
            labels:
              {{- include "multi-cluster-observability.labels" . | nindent 14 }}
          type: Opaque
          stringData:
            service-ca.crt: (( object.data['service-ca.crt'] ))
{{- end }}
