{{- if and (eq (include "apc-global-overrides.clusterIsHub" .) "true") .Values.thanosTlsCa.caBundle }}
apiVersion: v1
kind: Secret
metadata:
  name: thanos-tls-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "multi-cluster-observability.labels" . | nindent 4 }}
type: Opaque
data:
  service-ca.crt: {{ .Values.thanosTlsCa.caBundle | b64enc }}
{{- end }}
