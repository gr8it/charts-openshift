{{- if eq (include "apc-global-overrides.clusterIsHub" .) "true" }}
apiVersion: policies.kyverno.io/v1
kind: NamespacedGeneratingPolicy
metadata:
  name: generate-thanos-object-storage-secret
  namespace: open-cluster-management-observability
  labels:
    {{- include "multi-cluster-observability.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Generate Thanos Object Storage Secret
    policies.kyverno.io/category: ODF
    policies.kyverno.io/subject: Thanos Object Storage
    policies.kyverno.io/minversion: 1.20.0
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
    orphanDownstreamOnPolicyDelete:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["objectbucket.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["objectbucketclaims"]
  # the bucket Secret and ConfigMap are created by the OBC provisioner under the OBC name
  matchConditions:
    - name: bucket-provisioned
      expression: >-
        dyn(resource.Get("v1", "secrets", object.metadata.name)) != null &&
        dyn(resource.Get("v1", "configmaps", object.metadata.name)) != null
    - name: not-being-deleted
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: obcSecret
      expression: resource.Get("v1", "secrets", object.metadata.name)
    - name: obcConfigMap
      expression: resource.Get("v1", "configmaps", object.metadata.name)
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: thanos-object-storage
            namespace: open-cluster-management-observability
            labels:
              {{- include "multi-cluster-observability.labels" . | nindent 14 }}
          type: Opaque
          stringData:
            thanos.yaml: |
              type: s3
              config:
                bucket: (( variables.obcConfigMap.data.BUCKET_NAME ))
                endpoint: (( variables.obcConfigMap.data.BUCKET_HOST )):(( variables.obcConfigMap.data.BUCKET_PORT ))
                insecure: false
                access_key: "(( string(base64.decode(variables.obcSecret.data.?AWS_ACCESS_KEY_ID.orValue(''))) ))"
                secret_key: "(( string(base64.decode(variables.obcSecret.data.?AWS_SECRET_ACCESS_KEY.orValue(''))) ))"
                http_config:
                  tls_config:
                    insecure_skip_verify: false
                    ca_file: /etc/ssl/certs/thanos/service-ca.crt
{{- end }}
