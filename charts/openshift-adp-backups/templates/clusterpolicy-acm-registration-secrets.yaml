apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: velero-exclude-acm-registration-secrets
  annotations:
    policies.kyverno.io/title: Exclude ACM registration secrets from Velero backups
    policies.kyverno.io/category: Backup
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/minversion: 1.13.0
    policies.kyverno.io/description: >-
      Labels klusterlet hub-kubeconfig credentials so Velero skips them. They are
      bound to a ManagedCluster identity and must be regenerated on restore, not
      restored. The managedcluster-import-controller import secret is excluded
      via a pre-seeded Secret instead (see import-secret-exclusion.yaml) - server-side
      apply proved sufficient there, no Kyverno needed for it.
  labels:
    {{- include "openshift-adp-backups.labels" . | nindent 4 }}
spec:
  background: true
  mutateExistingOnPolicyUpdate: true
  rules:
    - name: exclude-klusterlet-hub-kubeconfigs
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - bootstrap-hub-kubeconfig
                - hub-kubeconfig-secret
              namespaceSelector:
                matchExpressions:
                  - key: createdByKlusterlet
                    operator: Exists
      mutate:
        targets:
          - apiVersion: v1
            kind: Secret
            name: "{{ `{{ request.object.metadata.name }}` }}"
            namespace: "{{ `{{ request.object.metadata.namespace }}` }}"
        patchStrategicMerge:
          metadata:
            labels:
              velero.io/exclude-from-backup: "true"
