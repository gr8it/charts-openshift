suite: Kyverno generated namespace rules
templates:
  - templates/generatingpolicy-application.yaml
  - templates/generatingpolicy-non-application.yaml
  - templates/generatingpolicy-cluster-monitoring.yaml
values:
  - ../values.example.yaml
release:
  name: monitoring
  namespace: openshift-monitoring

tests:
  - it: takes application vendor/team from namespace labels, falling back to platformAlertLabels
    template: templates/generatingpolicy-application.yaml
    asserts:
      - matchRegex:
          path: spec.generate[0].template.value
          pattern: '\n\s+vendor: \(\( variables\.vendor \)\)\n\s+team: \(\( variables\.team \)\)\n'
      - equal:
          path: spec.variables[0]
          value:
            name: platformVendor
            expression: '"examplevendor"'
      - equal:
          path: spec.variables[1]
          value:
            name: platformTeam
            expression: '"exampleteam"'
      - equal:
          path: spec.variables[2].expression
          value: "cel.bind(v, object.metadata.?labels[?'vendor'].orValue(''), v != '' ? v : variables.platformVendor)"

  - it: passes application fallbacks with spaces and apostrophes as CEL string literals
    template: templates/generatingpolicy-application.yaml
    set:
      platformAlertLabels:
        vendor: O'Reilly
        team: platform ops
    asserts:
      - equal:
          path: spec.variables[0].expression
          value: '"O''Reilly"'
      - equal:
          path: spec.variables[1].expression
          value: '"platform ops"'

  - it: processes namespace label updates made by Kyverno background controller
    template: templates/generatingpolicy-application.yaml
    asserts:
      - equal:
          path: spec.evaluation.skipBackgroundRequests
          value: false

  - it: keeps the downstream PrometheusRules synchronized and processes namespace updates
    templates:
      - templates/generatingpolicy-application.yaml
      - templates/generatingpolicy-non-application.yaml
      - templates/generatingpolicy-cluster-monitoring.yaml
    asserts:
      - equal:
          path: spec.evaluation.synchronize.enabled
          value: true
      - equal:
          path: spec.matchConstraints.resourceRules[0].operations
          value: ["CREATE", "UPDATE"]

  - it: routes non-application namespace alerts to platform
    template: templates/generatingpolicy-non-application.yaml
    asserts:
      - matchRegex:
          path: spec.generate[0].template.value
          pattern: '\n\s+vendor: "examplevendor"\n\s+team: "exampleteam"\n'

  - it: routes cluster monitoring namespace alerts to platform
    template: templates/generatingpolicy-cluster-monitoring.yaml
    asserts:
      - matchRegex:
          path: spec.generate[0].template.value
          pattern: '\n\s+vendor: "examplevendor"\n\s+team: "exampleteam"\n'

  - it: takes platform vendor/team from platformAlertLabels values
    templates:
      - templates/generatingpolicy-non-application.yaml
      - templates/generatingpolicy-cluster-monitoring.yaml
    set:
      platformAlertLabels:
        vendor: othervendor
        team: otherteam
    asserts:
      - matchRegex:
          path: spec.generate[0].template.value
          pattern: '\n\s+vendor: "othervendor"\n\s+team: "otherteam"\n'

  - it: renders platformAlertLabels as strings even when they look like other YAML types
    template: templates/generatingpolicy-non-application.yaml
    set:
      platformAlertLabels:
        vendor: "true"
        team: platform ops
    asserts:
      - matchRegex:
          path: spec.generate[0].template.value
          pattern: '\n\s+vendor: "true"\n\s+team: "platform ops"\n'

  - it: fails schema validation when platformAlertLabels.team is missing
    template: templates/generatingpolicy-application.yaml
    set:
      platformAlertLabels.team: null
    asserts:
      - failedTemplate:
          errorPattern: "platformAlertLabels"

  - it: fails schema validation when platformAlertLabels.vendor is not a string
    template: templates/generatingpolicy-application.yaml
    set:
      platformAlertLabels.vendor: 123
    asserts:
      - failedTemplate:
          errorPattern: "platformAlertLabels"

  - it: renders every rule from files/namespace-rules.yaml
    template: templates/generatingpolicy-application.yaml
    asserts:
      - matchRegex:
          path: spec.generate[0].template.value
          pattern: '(\n\s+- alert: [\s\S]*){25}'
      - notMatchRegex:
          path: spec.generate[0].template.value
          pattern: '(\n\s+- alert: [\s\S]*){26}'
      - matchRegex:
          path: spec.generate[0].template.value
          pattern: '- alert: [A-Za-z]+\n\s+expr: \|-\n\s+max by \(namespace,pod,container\) \(\n\s+max_over_time\(kube_pod_container_status_waiting_reason\{reason="CrashLoopBackOff", job="kube-state-metrics", namespace="\(\( object\.metadata\.name \)\)"\}'

  - it: has no Kyverno JMESPath leftovers in the generated rules
    templates:
      - templates/generatingpolicy-application.yaml
      - templates/generatingpolicy-non-application.yaml
      - templates/generatingpolicy-cluster-monitoring.yaml
    asserts:
      - notMatchRegex:
          path: spec.generate[0].template.value
          pattern: 'request\.object|\\\{\{'
