suite: Alertmanager Opsgenie description and tags
templates:
  - templates/secret-alertmanager-uwm.yaml
  - templates/secret-alertmanager.yaml
values:
  - ../values.example.yaml
release:
  name: monitoring
  namespace: openshift-monitoring

tests:
  - it: UWM Opsgenie description includes a Source line and separates grouped alerts
    template: templates/secret-alertmanager-uwm.yaml
    asserts:
      - matchRegex:
          path: spec.target.template.data["alertmanager.yaml"]
          pattern: 'reReplaceAll `\^\(\.\*\)/monitoring/graph'
      - matchRegex:
          path: spec.target.template.data["alertmanager.yaml"]
          pattern: 'runbook_url.*Runbook:'
      - matchRegex:
          path: spec.target.template.data["alertmanager.yaml"]
          pattern: '\{\{ "\{\{" \}\} if \$i \{\{ "\}\}" \}\}\n\s*---\n\s*\{\{ "\{\{" \}\} end \{\{ "\}\}" \}\}'

  - it: UWM Opsgenie tags carry the object-identifying labels alongside the common set
    template: templates/secret-alertmanager-uwm.yaml
    asserts:
      - matchRegex:
          path: spec.target.template.data["alertmanager.yaml"]
          pattern: 'alertname='
      - matchRegex:
          path: spec.target.template.data["alertmanager.yaml"]
          pattern: 'sync_status='
      - matchRegex:
          path: spec.target.template.data["alertmanager.yaml"]
          pattern: 'health_status='
      - matchRegex:
          path: spec.target.template.data["alertmanager.yaml"]
          pattern: 'autosync_enabled='
      - matchRegex:
          path: spec.target.template.data["alertmanager.yaml"]
          pattern: 'project='
      - matchRegex:
          path: spec.target.template.data["alertmanager.yaml"]
          pattern: 'repo='

  - it: platform Opsgenie description and tags on hub match the UWM receiver
    template: templates/secret-alertmanager.yaml
    asserts:
      - matchRegex:
          path: spec.target.template.data["alertmanager.yaml"]
          pattern: 'reReplaceAll `\^\(\.\*\)/monitoring/graph'
      - matchRegex:
          path: spec.target.template.data["alertmanager.yaml"]
          pattern: 'sync_status='
