apiVersion: monitoring.openshift.io/v1
kind: AlertingRule
metadata:
  name: cluster-alerting-rules
  namespace: openshift-monitoring
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  groups:
  - name: cluster.rules
    rules:
    - alert: PodRepeatedOOMKilled
      for: 0m
      expr: |
        max by (namespace, pod, container) (
          (
            increase(kube_pod_container_status_restarts_total[30m])
            * on(namespace,pod,container) group_left()
              kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}
          ) > 1
        )
      labels:
        severity: warning
        team: platform
        vendor: aspecta
      annotations:
        summary: |
          Container {{ `{{ $labels.container }}` }} in pod {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.pod }}` }} was OOM-killed {{ `{{ printf "%.0f" $value }}` }} times in the last 30 minutes
        description: |
          Container was OOM-killed more than once in the last 30 minutes.
          pod = {{ `{{ $labels.pod }}` }}
          container = {{ `{{ $labels.container }}` }}
          namespace = {{ `{{ $labels.namespace }}` }}
          restarts = {{ `{{ printf "%.0f" $value }}` }}
