{{- if .Values.objectBucketClaim.enabled }}
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: {{ required "objectBucketClaim.name is required" .Values.objectBucketClaim.name }}
  namespace: {{ .Values.objectBucketClaim.namespace | default .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    {{- include "acs-config.labels" . | nindent 4 }}
spec:
  generateBucketName: {{ .Values.objectBucketClaim.name }}
  storageClassName: {{ .Values.objectBucketClaim.storageClass }}
{{- end }}
