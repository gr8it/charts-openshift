suite: ObjectBucketClaim for acs-config
templates:
  - templates/objectbucketclaim.yaml
release:
  name: acs-config

tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the claim when enabled
    set:
      objectBucketClaim:
        create: true
        name: app-backup
        namespace: backup-ns
    asserts:
      - isKind:
          of: ObjectBucketClaim
      - equal:
          path: metadata.name
          value: app-backup
      - equal:
          path: metadata.namespace
          value: backup-ns
      - equal:
          path: spec.generateBucketName
          value: app-backup
      - equal:
          path: spec.storageClassName
          value: ocs-storagecluster-ceph-rgw

  - it: should fail without a name
    set:
      objectBucketClaim:
        create: true
        namespace: backup-ns
    asserts:
      - failedTemplate:
          errorMessage: objectBucketClaim.name is required
