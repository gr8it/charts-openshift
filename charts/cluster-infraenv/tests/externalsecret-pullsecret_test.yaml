# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: cluster-infraenv pull-secret ExternalSecret
templates:
  - templates/externalsecret-pullsecret.yaml
release:
  name: cluster-infraenv-prod01
  namespace: infrastructure-prod01

tests:
  - it: should prefer local environment and service values over global values
    set:
      envName: local
      infraEnvName: infrastructure-local
      osImageVersion: "4.15"
      nmStateConfigs:
        - name: node-01
          interfaces:
            - macAddress: "aa:bb:cc:dd:ee:01"
              name: ens0
          config: {}
      environmentShort: local-env
      services:
        externalSecretsOperator:
          defaultClusterSecretStore: local-vault
        vault:
          KVmountPlatform: local-kv
      global.apc.environmentShort: global-env
      global.apc.services.externalSecretsOperator.defaultClusterSecretStore: global-vault
      global.apc.services.vault.KVmountPlatform: global-kv
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: local-vault
      - equal:
          path: spec.data[0].remoteRef.key
          value: local-kv/local-env/infraenv/infrastructure-local/pullSecret
