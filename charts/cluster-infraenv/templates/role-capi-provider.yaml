apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capi-provider-role
  namespace: {{ include "cluster-infraenv.infraEnvName" . }}
  labels:
    {{- include "cluster-infraenv.labels" . | nindent 4 }}
rules:
  - verbs:
      - '*'
    apiGroups:
      - agent-install.openshift.io
    resources:
      - agents
